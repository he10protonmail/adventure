<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szene 4 – Tatort, Hartmanns Abteil</title>
<style>
:root{--bg:#14110d;--paper:#f1e6cf;--ink:#2a1f14;--gold:#c9a24a;--red:#8a1f2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}
header{padding:10px 16px;border-bottom:2px solid var(--gold);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:18px;letter-spacing:2px;color:var(--gold)}
header span{font-size:13px;opacity:.8}
main{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
#stage{position:relative;flex:0 0 auto;width:min(580px,100%);aspect-ratio:765/1024;background:#221c14;border:3px solid #000;box-shadow:0 0 0 2px var(--gold);overflow:hidden;cursor:default}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hs{position:absolute;z-index:60;border:2px solid transparent;border-radius:8px;transition:.15s}
.hs.ev{z-index:62}
.m-glimmen .hs.ev:not(.seen){animation:gl 2.2s ease-in-out infinite}
@keyframes gl{0%,100%{box-shadow:0 0 0 rgba(255,217,138,0);border-color:rgba(255,217,138,0)}50%{box-shadow:0 0 14px rgba(255,217,138,.8);border-color:rgba(255,217,138,.8)}}
.m-glimmen .hs:hover{border-color:var(--gold);background:rgba(201,162,74,.15)}
.m-glimmen .hs.seen{border-color:rgba(47,107,58,.8)}
.m-glimmen .hs,.m-lupe .hs{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><circle cx='14' cy='14' r='10' fill='rgba(255,240,200,.25)' stroke='black' stroke-width='4'/><circle cx='14' cy='14' r='10' fill='none' stroke='%23c9a24a' stroke-width='2'/><line x1='21' y1='21' x2='33' y2='33' stroke='black' stroke-width='6' stroke-linecap='round'/><line x1='21' y1='21' x2='33' y2='33' stroke='%23c9a24a' stroke-width='3' stroke-linecap='round'/></svg>") 14 14,zoom-in}
.m-keine .hs{cursor:default}
#flyout{position:absolute;z-index:130;max-width:240px;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:6px 10px;font:14px/1.4 Georgia,serif;border-radius:4px;display:none;pointer-events:none}
#cap{position:absolute;left:4%;right:4%;top:3%;z-index:110;background:rgba(20,14,8,.9);border:2px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:clamp(13px,1.6vw,17px);line-height:1.45;display:none;pointer-events:none}
aside{flex:0 1 380px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.box{background:#201a13;border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.box h2{margin:0 0 6px;font-size:14px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
#story{font-size:15px;line-height:1.5;background:var(--paper);color:var(--ink)}
#story h2{color:var(--red)}
button{background:var(--ink);color:var(--paper);border:1px solid var(--gold);padding:7px 11px;font:13px Georgia;border-radius:4px;cursor:pointer;text-align:left}
button:hover{background:#3a2c1c}
button.sel{background:var(--gold);color:var(--ink);font-weight:bold}
button.go{background:var(--red);border-color:#000;text-align:center;font-weight:bold}
.hint{font-size:12px;opacity:.75;margin-top:6px}
#log{max-height:200px;overflow:auto;font-size:13.5px;line-height:1.4}
#log p{margin:5px 0;font-style:italic}
#diary{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.4}
#diary li{padding:5px 0;border-bottom:1px dashed #5a4a30}
#diary li:last-child{border:0}
#diary .empty{opacity:.6;font-style:italic}

#bgT,#bgD{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
#bgD{display:none}
#cap b{color:var(--gold);margin-right:6px}
#cap .x{float:right;color:var(--gold);font-size:.8em;opacity:.8}
.hs.nav.seen{border-color:transparent}
.hs.low{z-index:58}
.m-glimmen .hs.nav{animation:gl 2.2s ease-in-out infinite}
#back{position:absolute;left:3%;bottom:2.5%;z-index:140;display:none}
.vw{position:absolute;inset:0}
#cap{pointer-events:auto;cursor:pointer}
</style></head><body>

   ev:{k:"tuerfest",t:"Die Verbindungstür saß trotz des abgefeilten Riegels auffallend fest; frische Kratzer am Türrand."}},
  {id:"scheibe",name:"Türscheibe",x:28.8,y:13.3,w:42.6,h:33.7,say:"Hinter der matten Scheibe liegt Abteil 7. Ich sehe nur Umrisse, keine Bewegung."},
  {id:"schild",name:"Messingschild",x:45,y:48.9,w:10,h:5.9,say:"Ein Messingschild ohne Aufschrift."},
  {id:"scherben",name:"Glassplitter",x:0,y:92.9,w:100,h:7.1,say:"Einzelne Glassplitter liegen auf den Dielen, bis hierher gesprungen. Sie stammen vom Fenster."},
  {id:"riegel",name:"Riegel",x:17.3,y:43.3,w:24.6,h:12.1,
   say:"Der Riegel greift nur halb. An der Kante blanke, frische Feilspuren, ein paar Metallspäne liegen noch im Falz. Ein ausgeleierter Riegel sieht anders aus: Dieser wurde absichtlich bearbeitet.",
   ev:{k:"riegel",t:"Der Riegel an der Verbindungstür zu Abteil 7 ist abgefeilt (frische Feilspuren) und hält nicht zuverlässig."}},
  {id:"zurueck",name:"Zurück ins Abteil",x:0,y:0,w:0,h:0,hidden:true}
 ]}
};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stage=$('stage'),fly=$('flyout'),cap=$('cap');
const flags=new Set(),notes=new Map();
const ALL=[...VIEWS.abteil.hots,...VIEWS.tuer.hots].filter(h=>h.ev);
const KEYS=[...new Set(ALL.map(h=>h.ev.k))];
let view='abteil';

/* Gemeinsames Tagebuch aller Kapitel: localStorage 'eid_diary' = [[Schlüssel, Text], ...], 'eid_notes' = Schlüssel, 'eid_flags' = Merker */
function store(){try{
  const a=JSON.parse(localStorage.getItem('eid_diary')||'[]');
  notes.forEach((t,k)=>{if(!a.some(x=>x[0]===k))a.push([k,t])});
  localStorage.setItem('eid_diary',JSON.stringify(a));
  const n=new Set(JSON.parse(localStorage.getItem('eid_notes')||'[]'));notes.forEach((t,k)=>n.add(k));
  localStorage.setItem('eid_notes',JSON.stringify([...n]));
  const f=new Set(JSON.parse(localStorage.getItem('eid_flags')||'[]'));flags.forEach(x=>f.add('f_'+x));
  localStorage.setItem('eid_flags',JSON.stringify([...f]));
}catch(e){}}
function addNote(k,t,quiet){
  if(notes.has(k))return;notes.set(k,t);flags.add(k);
  const d=$('diary');if(d.querySelector('.empty'))d.innerHTML='';
  const li=document.createElement('li');li.textContent=t;d.appendChild(li);
  if(!quiet)store();
}
try{JSON.parse(localStorage.getItem('eid_diary')||'[]').forEach(([k,t])=>addNote(k,t,true))}catch(e){}
function count(){
  const n=KEYS.filter(k=>flags.has(k)).length;
  $('count').textContent='Ich habe '+n+' von '+KEYS.length+' Spuren im Abteil untersucht. Ich kann jederzeit zurückkehren.';
}
function logAdd(t){const l=$('log');if(l.querySelector('i'))l.innerHTML='';l.insertAdjacentHTML('beforeend','<p><b>'+ICH+':</b> '+esc(t)+'</p>');l.scrollTop=l.scrollHeight}
let ct=0;
function say(t){
  cap.innerHTML='<b>'+ICH+':</b>'+esc(t)+'<span class="x">schließen</span>';cap.style.display='block';
  clearTimeout(ct);ct=setTimeout(()=>cap.style.display='none',Math.max(5000,t.length*65));
}
cap.onclick=e=>{e.stopPropagation();cap.style.display='none'};

function showView(v){
  view=v;cap.style.display='none';fly.style.display='none';
  $('bgT').style.display=v==='abteil'?'block':'none';
  $('bgD').style.display=v==='tuer'?'block':'none';
  $('hotsAbteil').style.display=v==='abteil'?'block':'none';
  $('hotsTuer').style.display=v==='tuer'?'block':'none';
  $('back').style.display=v==='tuer'?'block':'none';
  $('vtitle').textContent=v==='abteil'?'Abteil 8':'Verbindungstür';
  $('storytext').textContent=v==='abteil'?STORY_A:STORY_T;
}
const STORY_A='Die Fensterscheibe ist eingeschlagen, Hartmann liegt auf dem Rücken, der Schemel ist umgestürzt. Ich bin Arzt und Beobachter, und ich fasse nichts an, ohne es genau anzusehen. Mit der Lupe kann ich alles im Abteil untersuchen. In der Ecke links unten muss die Verbindungstür zu Abteil 7 liegen.';
const STORY_T='Die Verbindungstür zwischen Abteil 7 und Abteil 8, von Hartmanns Seite aus gesehen. Auf den Dielen liegen Glassplitter.';

Object.entries(VIEWS).forEach(([vn,V])=>{
  const host=$(vn==='abteil'?'hotsAbteil':'hotsTuer');
  V.hots.forEach(h=>{
    if(h.hidden)return;
    const d=document.createElement('div');d.className='hs'+(h.ev?' ev':'')+(h.nav?' nav':'')+(['sitze','koerper','tuerblatt'].includes(h.id)?' low':'');d.id='hs-'+h.id;
    d.style.cssText=`left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
    d.addEventListener('mouseenter',()=>{
      if(!stage.classList.contains('m-glimmen'))return;
      fly.textContent=h.name;fly.style.display='block';
      const r=stage.getBoundingClientRect(),dr=d.getBoundingClientRect();
      let x=dr.right-r.left+8;if(x+250>r.width)x=dr.left-r.left-250;fly.style.left=Math.max(4,x)+'px';fly.style.top=Math.max(4,dr.top-r.top)+'px'});
    d.addEventListener('mouseleave',()=>fly.style.display='none');
    d.addEventListener('click',e=>{
      e.stopPropagation();fly.style.display='none';
      if(h.nav){say(h.say);logAdd(h.say);setTimeout(()=>showView(h.nav),700);return}
      let t=h.say;
      if(h.ev){
        if(h.req&&!flags.has(h.req)){t=h.sayEarly}
        else{addNote(h.ev.k,h.ev.t);d.classList.add('seen');store();
          document.querySelectorAll('.hs.ev').forEach(x=>{const hh=ALL.find(a=>'hs-'+a.id===x.id);if(hh&&hh.ev.k===h.ev.k)x.classList.add('seen')});count()}
      }
      logAdd(t);say(t);
    });
    host.appendChild(d);
  });
});
/* bereits untersuchte Spuren markieren (Rückkehr ins Kapitel) */
ALL.forEach(h=>{if(notes.has(h.ev.k)){flags.add(h.ev.k);$('hs-'+h.id).classList.add('seen')}});
count();
stage.addEventListener('click',()=>{cap.style.display='none'});
$('back').onclick=e=>{e.stopPropagation();showView('abteil')};

function setMode(m){
  stage.classList.remove('m-glimmen','m-lupe','m-keine');stage.classList.add('m-'+m);
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===m));
  $('mhint').textContent={glimmen:'Glimmen: Anklickbares schimmert, Namen erscheinen beim Darüberfahren.',lupe:'Lupe: Nur der Mauszeiger wird zur Lupe, sobald etwas anklickbar ist.',keine:'Keine: Keine Rückmeldung. Du musst selbst suchen.'}[m];
  fly.style.display='none';try{localStorage.setItem('eid_hinweis',m)}catch(e){}
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let sm='lupe';try{sm=localStorage.getItem('eid_hinweis')||'lupe'}catch(e){}
setMode(['glimmen','lupe','keine'].includes(sm)?sm:'lupe');
showView('abteil');

$('next').onclick=()=>{
  const d={type:'szene-ende',szene:'tatort',flags:[...flags],notizen:[...notes.keys()]};
  let h=false;
  try{if(typeof window.onSzeneEnde==='function'){window.onSzeneEnde(d);h=true}}catch(e){}
  try{if(window.parent&&window.parent!==window){window.parent.postMessage(d,'*');h=true}}catch(e){}
  if(!h)location.href=NEXT;
};

try{localStorage.setItem('eid_progress',me);var m=+localStorage.getItem('eid_maxch')||0,i=N.indexOf(me)+2;if(i>m)localStorage.setItem('eid_maxch',String(i))}catch(e){}
document.addEventListener('DOMContentLoaded',function(){var a=document.createElement('a');a.href='szene1_titelbild.html';a.textContent='\u2630 Hauptmenü';a.style.cssText='position:fixed;top:6px;right:10px;z-index:9999;font:12px Georgia,serif;color:#c9a24a;background:rgba(20,17,13,.85);border:1px solid #c9a24a;border-radius:3px;padding:2px 8px;text-decoration:none';document.body.appendChild(a)})})();
</script>
