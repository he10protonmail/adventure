<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szene 3 – Speisewagen</title>
<style>
:root{--bg:#14110d;--paper:#f1e6cf;--ink:#2a1f14;--gold:#c9a24a;--red:#8a1f2b;--green:#2f6b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}
header{padding:10px 16px;border-bottom:2px solid var(--gold);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:18px;letter-spacing:2px;color:var(--gold)}
header span{font-size:13px;opacity:.8}
main{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
#stage{position:relative;flex:0 0 auto;width:min(580px,100%);aspect-ratio:682/1024;background:#221c14;border:3px solid #000;box-shadow:0 0 0 2px var(--gold);overflow:hidden;cursor:default}
#svgbg,#bg{position:absolute;inset:0;width:100%;height:100%}
#svgbg svg{width:100%;height:100%;display:block}
#bg{object-fit:fill;display:none}
/* Personen (freigestellt) */
.bust{position:absolute;transform:translateX(-50%);transition:.2s;pointer-events:none}
.bust img{height:100%;width:auto;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}
#names{position:absolute;inset:0;z-index:100;pointer-events:none}
#names .nm{position:absolute;transform:translateX(-50%);background:var(--ink);color:var(--paper);border:1px solid var(--gold);font-size:clamp(9px,1.3vw,12px);padding:1px 6px;white-space:nowrap;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.bust.dim{opacity:.5;filter:saturate(.55) brightness(.8)}
.bust.talk{opacity:1;filter:none;transform:translateX(-50%) translateY(-5px)}
.bust.talk img{filter:drop-shadow(0 0 10px rgba(255,217,138,.95)) drop-shadow(0 3px 6px rgba(0,0,0,.7))}
#names .nm.me{background:var(--gold);color:var(--ink)}
#bubble{position:absolute;z-index:120;max-width:62%;min-width:34%;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:3px 3px 0 rgba(0,0,0,.5);border-radius:12px;padding:8px 12px;font:clamp(12px,2vw,16px)/1.4 Georgia,serif;display:none;cursor:pointer}
#bubble b{display:block;color:var(--red);font-size:.78em;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
#bubble .more{display:block;text-align:right;color:#7a6330;font-size:.8em;margin-top:2px}
#bubble::after{content:"";position:absolute;left:var(--tx,50%);bottom:-11px;width:16px;height:16px;background:var(--paper);border-right:2px solid #000;border-bottom:2px solid #000;transform:translateX(-50%) rotate(45deg)}
#bubble.below::after{bottom:auto;top:-11px;border:0;border-left:2px solid #000;border-top:2px solid #000}
.tbl{position:absolute;top:34%;height:44%;border:2px dashed transparent;border-radius:8px;pointer-events:none}
.tbl.hear{border-color:rgba(201,162,74,.55);background:rgba(201,162,74,.06)}
.tag{position:absolute;top:34%;background:var(--ink);color:var(--gold);border:1px solid var(--gold);padding:2px 10px;font-size:clamp(10px,1.2vw,14px);letter-spacing:2px;z-index:55;border-radius:3px}
/* Hotspots */
.hs{position:absolute;z-index:60;border:2px solid transparent;border-radius:8px;transition:.15s}
.m-glimmen .hs.avail:not(.seen){animation:gl 2.2s ease-in-out infinite}
@keyframes gl{0%,100%{box-shadow:0 0 0 rgba(255,217,138,0);border-color:rgba(255,217,138,.0)}50%{box-shadow:0 0 14px rgba(255,217,138,.8);border-color:rgba(255,217,138,.8)}}
.m-glimmen .hs:hover{border-color:var(--gold);background:rgba(201,162,74,.15)}
.m-glimmen .hs,.m-lupe .hs{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><circle cx='14' cy='14' r='10' fill='rgba(255,240,200,.25)' stroke='black' stroke-width='4'/><circle cx='14' cy='14' r='10' fill='none' stroke='%23c9a24a' stroke-width='2'/><line x1='21' y1='21' x2='33' y2='33' stroke='black' stroke-width='6' stroke-linecap='round'/><line x1='21' y1='21' x2='33' y2='33' stroke='%23c9a24a' stroke-width='3' stroke-linecap='round'/></svg>") 14 14,zoom-in}
.m-keine .hs{cursor:default}
#cap{position:absolute;left:4%;right:4%;bottom:3%;z-index:110;background:rgba(20,14,8,.88);border:2px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:clamp(13px,1.5vw,18px);line-height:1.45;display:none;cursor:pointer}
#cap b{color:var(--gold);margin-right:6px}
#cap i{opacity:.9}
#cap .more{float:right;color:var(--gold);font-size:.8em;opacity:.8}
#flyout{position:absolute;z-index:130;max-width:300px;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:8px 10px;font:14px/1.4 Georgia,serif;border-radius:4px;display:none;pointer-events:none}
aside{flex:0 1 380px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.box{background:#201a13;border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.box h2{margin:0 0 6px;font-size:14px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
#story{font-size:15px;line-height:1.5;background:var(--paper);color:var(--ink)}
#story h2{color:var(--red)}
button{background:var(--ink);color:var(--paper);border:1px solid var(--gold);padding:7px 11px;font:13px Georgia;border-radius:4px;cursor:pointer;text-align:left}
button:hover:not(:disabled){background:#3a2c1c}
button:disabled{opacity:.45;cursor:not-allowed}
button.sel{background:var(--gold);color:var(--ink);font-weight:bold}
button.go{background:var(--red);border-color:#000;text-align:center;font-weight:bold}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row label{font-size:13px;opacity:.85}
#choice .hint{font-size:12px;opacity:.75;margin-top:6px}
#log{max-height:260px;overflow:auto;font-size:13.5px;line-height:1.4}
#log p{margin:5px 0}
#log b{color:var(--gold)}
#log .st{font-style:italic;opacity:.85}
#log .hd{color:var(--gold);letter-spacing:1px;text-transform:uppercase;font-size:12px;margin-top:10px}
#diary{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.4}
#diary li{padding:5px 0;border-bottom:1px dashed #5a4a30}
#diary li:last-child{border:0}
#diary .empty{opacity:.6;font-style:italic}
</style></head><body>

const GAENGE=[
 {titel:"Gang 1: Suppe",
  A:[["Hartmann","Wir liefern an fünf Armeen, Major. Und keine hat sich je beklagt."],
     ["Picard","Dann hat keine Ihre Zünder je nötig gehabt. Ich habe sie im Manöver gesehen, Monsieur Hartmann. Von zehn Granaten blieben drei im Boden.",{n:["picard_zuender","Picard sagt am Tisch, von zehn Granaten aus Hartmanns Fabrik seien im Manöver drei im Boden geblieben."]}],
     ["Hartmann","Manöver sind keine Fabrik."],
     ["Quill","(glättend) Herr Major, solche Zahlen schwanken. Ich lasse Ihnen gern die Prüfprotokolle zukommen."],
     ["Picard","Schicken Sie nichts. Ich habe heute früh nach Marseille telegrafiert. Dort wird man Fragen stellen.",{n:["telegramm","Picard hat heute früh nach Marseille telegrafiert und gesagt, dort werde man Fragen stellen."],f:"g1A"}],
     ["*","Quill hält sein Glas auffallend ruhig."]],
  B:[["Lady Ashworth","(zu Clarissa, halblaut) Sehen Sie sich den Major an, mein Kind. Ein Soldat bleibt ein Soldat, auch im Speisewagen."],
     ["Clarissa","Er sieht eher traurig aus."],
     ["Pater Anselm","Traurige Männer sind oft die ehrlichsten."]]},
 {titel:"Gang 2: Hauptgang",
  A:[["Hartmann","Ich halte nichts von Drohungen, Major. Aber falls Sie je an eine denken: Hier, unser neues Modell. Sechs Schuss. Nehmen Sie es ruhig in die Hand. So antwortet meine Fabrik auf Gewalt."],
     ["Picard","(wiegt die Waffe und schmunzelt) Ein hübsches Stück. Sie drohen mir mit einem Spielzeug, Monsieur? Wer es in der Hand hält, glaubt an seine Munition.",{f:"g2Arev"}],
     ["Hartmann","Ich warne Sie nur. Glauben Sie bitte daran, dass es sich nicht lohnt."],
     ["*","Hartmann legt das Modell in sein Etui zurück und steckt es ein. Quill folgt dem Etui mit dem Blick.",{n:["revolver_vorf","Hartmann führt Picard sein neues Revolvermodell (sechs Schuss) als Warnung vor, damit der Major nicht gewalttätig wird; Picard schmunzelt. Hartmann legt es ins Etui zurück und steckt es ein, Quill folgt dem Etui mit dem Blick."]}],
     ["Quill","Herr Hartmann, ich habe eine Flasche aus dem Willkommenskorb mitgebracht, ein guter Jahrgang, auf Kosten der Compagnie."],
     ["Hartmann","(kühl) Danke, Quill. Ich trinke heute nichts, was ich nicht selbst geöffnet habe."],
     ["Quill","Wie Sie wünschen."],
     ["*","Er lächelt gequält und stellt die Flasche zur Seite.",{n:["wein","Quill bietet Hartmann Wein aus dem Willkommenskorb an. Hartmann lehnt ab: Er trinke nichts, was er nicht selbst geöffnet habe."],f:"g2A"}]],
  B:[["Fenwick","(zu Wyss) Haben Sie je einen Dytiscus gesehen, Herr Doktor? Ein Wasserkäfer, gefräßig wie ein Löwe. Ich bringe vier Stück nach Marseille, in meinen Gläsern."],
     ["Clarissa","(leise, zu Fenwick) Und Sie zeigen sie mir, wenn alle schlafen?"],
     ["Fenwick","(verlegen) Fräulein Whitlock, bitte."],
     ["*","Lady Ashworth hört es nicht.",{f:"g2B"}]]},
 {titel:"Gang 3: Dessert und Kaffee",
  A:[["Picard","Wer hat die Prüfungen gekürzt, Monsieur Hartmann? Rekruten sterben an Ihren Zündern."],
     ["Hartmann","(laut) Sie wissen nicht, wovon Sie sprechen, Sie Papiersoldat!"],
     ["*","Gläser verstummen. Lady Ashworth beobachtet das Paar. Hartmann senkt die Stimme und spricht den nächsten Satz in Quills Richtung."],
     ["Hartmann","Ich werde die Unterlagen noch einmal durchgehen, heute Nacht, jede Zeile. Dann wissen wir, wer gefehlt hat.",{n:["streit","Hartmann beschimpft Picard laut als Papiersoldat und sagt danach in Quills Richtung, er werde die Unterlagen heute Nacht durchgehen, jede Zeile. Quill erstarrt kurz und lächelt dann wieder."],f:"streitGesehen"}],
     ["Picard","(steht auf) Gute Nacht, Messieurs. Ich wünsche Ihnen, dass Ihre Papiere in Ordnung sind."],
     ["*","Hartmann und Quill verlassen den Wagen in Richtung Schlafwagen. Quill bleibt einen Schritt zurück und sieht dem Major nach."]],
  B:[["Lady Ashworth","Haben Sie das gehört, Doktor? Dieser Hartmann hat den Major vor allen Gästen beschimpft.",{n:["streit_gehoert","Lady Ashworth erzählt, Hartmann habe den Major vor allen Gästen beschimpft (aus zweiter Hand)."],f:"streitGesehen"}],

/* ===== Hintergrund (Platzhalter, ersetzt durch speisewagen.jpg) ===== */
function wagonSVG(){
  const W=1537,H=1023,px=v=>v*W/100,py=v=>v*H/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2416"/><stop offset="1" stop-color="#1e120a"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1f22"/><stop offset="1" stop-color="#2a0f10"/></linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e6cf"/><stop offset="1" stop-color="#bfae8c"/></linearGradient>
  <radialGradient id="lg"><stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
  <radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#wall)"/>`;
  /* Holzvertäfelung */
  for(let x=0;x<W;x+=96){s+=`<rect x="${x+6}" y="${py(40)}" width="84" height="${py(40)}" fill="#2b1a10" stroke="#4a3020" stroke-width="3"/>`}
  /* Fenster mit Nacht */
  [8,32,56,80].forEach(x=>{s+=`<rect x="${px(x)}" y="${py(6)}" width="${px(13)}" height="${py(22)}" rx="6" fill="#0c1220" stroke="#b08a3a" stroke-width="6"/>`;
    for(let k=0;k<5;k++)s+=`<circle cx="${px(x)+30+k*40}" cy="${py(6)+60+((k*37)%90)}" r="3" fill="#e8b860" opacity=".7"/>`});
  /* Wandlampen */
  [6,30,54,78,95].forEach(x=>{s+=`<circle cx="${px(x)}" cy="${py(34)}" r="70" fill="url(#lg)"/><rect x="${px(x)-9}" y="${py(32)}" width="18" height="26" fill="#ffd98a"/>`});
  /* Boden */
  s+=`<rect y="${py(80)}" width="${W}" height="${py(20)}" fill="url(#car)"/>`;
  for(let x=0;x<W;x+=64)s+=`<rect x="${x}" y="${py(88)}" width="32" height="${py(12)}" fill="#000" opacity=".12"/>`;
  /* Sitzlehnen hinter den Personen */
  Object.values(SITZ).forEach(([x,y])=>{s+=`<path d="M${px(x)-12} ${py(y)+py(24)} V${py(y)+40} Q${px(x)+px(5)} ${py(y)-34} ${px(x)+px(10)+12} ${py(y)+40} V${py(y)+py(24)}Z" fill="#6a1f26" stroke="#2a0f10" stroke-width="4"/>`});
  /* Tische */
  [[5,47],[53,95]].forEach(([a,b],i)=>{
    s+=`<polygon points="${px(a)},${py(55)} ${px(b)},${py(55)} ${px(b+2)},${py(73)} ${px(a-2)},${py(73)}" fill="url(#cloth)" stroke="#8a7a5a" stroke-width="3"/>`;
    s+=`<polygon points="${px(a-2)},${py(73)} ${px(b+2)},${py(73)} ${px(b)},${py(82)} ${px(a)},${py(82)}" fill="#cdbd9a" opacity=".85"/>`;
    s+=`<circle cx="${px((a+b)/2)}" cy="${py(53)}" r="62" fill="url(#lg)"/><rect x="${px((a+b)/2)-8}" y="${py(54)-14}" width="16" height="22" fill="#e8b860" stroke="#6a4a1a" stroke-width="2"/>`;
    for(let k=0;k<(i?4:3);k++){const cx=px(a+3+k*((b-a-6)/(i?3:2)));s+=`<ellipse cx="${cx}" cy="${py(66)}" rx="46" ry="12" fill="#fff" stroke="#8a7a5a" stroke-width="2"/><ellipse cx="${cx}" cy="${py(65.5)}" rx="26" ry="6" fill="#d9ceb0"/><rect x="${cx+40}" y="${py(58)}" width="10" height="24" fill="#cfe0e8" opacity=".6" stroke="#789" stroke-width="1.5"/>`}
  });
  /* Objekte: Revolver+Etui, Flasche, Kanne, Karte, Zeitung, Zucker */
  s+=`<rect x="${px(13.5)}" y="${py(61.5)}" width="${px(9.5)}" height="${py(5)}" rx="6" fill="#3a2414" stroke="#c9a24a" stroke-width="2"/><rect x="${px(15)}" y="${py(63)}" width="${px(6.2)}" height="6" fill="#aab4bc"/>`;
  s+=`<rect x="${px(44.2)}" y="${py(52)}" width="${px(2)}" height="${py(12)}" fill="#1c3a22" stroke="#0b1a10" stroke-width="2"/><rect x="${px(44.9)}" y="${py(49.5)}" width="${px(.6)}" height="${py(3)}" fill="#1c3a22"/><rect x="${px(44.6)}" y="${py(49)}" width="${px(1.2)}" height="8" fill="#b08a3a" transform="rotate(8 ${px(45)} ${py(49)})"/>`;
  s+=`<rect x="${px(61.5)}" y="${py(61)}" width="${px(3.4)}" height="${py(6)}" rx="8" fill="#b9c0c6" stroke="#566" stroke-width="2"/>`;
  s+=`<rect x="${px(34.5)}" y="${py(67)}" width="${px(5)}" height="${py(3)}" fill="#e8dbb8" stroke="#c9a24a" stroke-width="2"/>`;
  s+=`<polygon points="${px(52.8)},${py(65)} ${px(57)},${py(64.4)} ${px(57)},${py(68.5)} ${px(52.8)},${py(69)}" fill="#d9d2c0" stroke="#776" stroke-width="1.5"/>`;
  s+=`<rect x="${px(79)}" y="${py(62.5)}" width="${px(3)}" height="${py(4.5)}" rx="8" fill="#e8e0d0" stroke="#8a7a5a" stroke-width="2"/>`;
  /* Kellner im Gang */
  s+=`<g><circle cx="${px(50)}" cy="${py(28)}" r="34" fill="#c9a98a"/><rect x="${px(50)-46}" y="${py(28)+30}" width="92" height="${py(30)}" rx="14" fill="#111"/><rect x="${px(50)-30}" y="${py(28)+60}" width="60" height="${py(24)}" fill="#f1e6cf"/><ellipse cx="${px(50)+66}" cy="${py(44)}" rx="48" ry="8" fill="#c0c6cc"/></g>`;
  /* Wyss' Sitz */
  s+=`<path d="M${px(46)} ${H} V${py(86)} Q${px(50)} ${py(78)} ${px(54)} ${py(86)} V${H}Z" fill="#241012" stroke="#000" stroke-width="4"/>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#vg)"/></svg>`;
  return s;
}

const bg=document.getElementById('bg');
bg.addEventListener('load',()=>{bg.style.display='block'});

/* ===== Büsten (freigestellt, am Sitzplatz) ===== */
const busts={};let wyssEl=null;
function makeBust(id,x,y,name,me){
  const d=document.createElement('div');d.className='bust'+(me?' me':'');
  d.style.cssText=`left:${x}%;bottom:${100-y}%;height:${GEO[id]}%;z-index:${Math.round(10+y/2)}`;
  const im=document.createElement('img');im.alt=name;im.src=CUT[id];
  d.appendChild(im);
  document.getElementById('busts').appendChild(d);
  let NL=document.getElementById('names');if(!NL){NL=document.createElement('div');NL.id='names';document.getElementById('stage').appendChild(NL)}
  const nm=document.createElement('span');nm.className='nm'+(me?' me':'');nm.textContent=name;
  nm.style.cssText=`left:${x}%;bottom:calc(${100-y}% - 4px)`;NL.appendChild(nm);
  return d;
}
Object.entries(SITZ).forEach(([id,[x,y]])=>{busts[id]=makeBust(id,x,y,NAMEN[id],false)});
wyssEl=makeBust('wyss',50,100,'Dr. Wyss (ich)',true);

/* ===== Zustand ===== */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const flags=new Set(),notes=new Map(),choices=[];
let gang=0,table=null,idx=0,playing=false,over=false;
function save(){
  try{
    let old=[];try{old=JSON.parse(localStorage.getItem('eid_notes')||'[]')||[]}catch(e){}
    localStorage.setItem('eid_notes',JSON.stringify([...new Set([...old,...notes.keys()])]));
    localStorage.setItem('eid_flags',JSON.stringify([...flags]));
  }catch(e){}
  window.EID_NOTES=[...notes.keys()];
}
function addNote(k,t,quiet){
  if(notes.has(k))return;notes.set(k,t);
  const d=$('diary');if(d.querySelector('.empty'))d.innerHTML='';
  const li=document.createElement('li');li.textContent=t;d.appendChild(li);
  if(!quiet){try{const a=JSON.parse(localStorage.getItem('eid_diary')||'[]');if(!a.some(x=>x[0]===k)){a.push([k,t]);localStorage.setItem('eid_diary',JSON.stringify(a))}}catch(e){}}
  save();
}
/* Einträge aus früheren Kapiteln (Bahnhof Paris) übernehmen */
try{JSON.parse(localStorage.getItem('eid_diary')||'[]').forEach(([k,t])=>addNote(k,t,true))}catch(e){}
function logAdd(html){const l=$('log');if(l.querySelector('i'))l.innerHTML='';l.insertAdjacentHTML('beforeend',html);l.scrollTop=l.scrollHeight}

const NEXT='szene4_tatort.html'; /* nächstes Kapitel: Tatort, Hartmanns Abteil */
/* ===== Gänge ===== */
function renderChoice(){
  const g=GAENGE[gang];
  $('gtitle').textContent=g?g.titel+' ('+(gang+1)+' von 3)':'Der Abend ist vorbei';
  const b=$('gbtns');b.innerHTML='';$('ghint').textContent='';
  if(!g){return}
  if(table===null){
    ['A','B'].forEach(t=>{
      const x=document.createElement('button');
      x.textContent=t==='A'?'Tisch A zuhören (Hartmann, Quill, Picard)':'Tisch B zuhören (Lady Ashworth, Clarissa, Fenwick, Pater Anselm)';
      x.onclick=()=>listen(t);b.appendChild(x)});
    $('ghint').textContent='Ich kann pro Gang nur einem Tisch zuhören. Was am anderen Tisch gesagt wird, bleibt mir verborgen.';
  }else if(!playing){
    const n=document.createElement('button');n.className='go';
    n.textContent=gang<2?'Weiter zum nächsten Gang':'Den Abend beenden';n.onclick=nextGang;b.appendChild(n);
    $('ghint').textContent='Bevor es weitergeht, kann ich mich im Wagen umsehen.';
  }
}
function listen(t){
  table=t;idx=0;playing=true;choices[gang]=t;
  $('tbl'+t).classList.add('hear');$('tbl'+(t==='A'?'B':'A')).classList.remove('hear');
  Object.entries(busts).forEach(([id,el])=>el.classList.toggle('dim',SITZ[id][2]!==t));
  logAdd(`<div class="hd">${esc(GAENGE[gang].titel)}, Tisch ${t}</div>`);
  renderChoice();step();
}
const bub=$('bubble');
function placeBubble(id){
  const el=id==='wyss'?wyssEl:busts[id];if(!el)return false;
  const sr=stage.getBoundingClientRect(),br=el.getBoundingClientRect();
  bub.style.display='block';bub.classList.remove('below');
  const bw=bub.offsetWidth,bh=bub.offsetHeight;
  const cx=br.left-sr.left+br.width/2;
  const left=Math.min(Math.max(cx-bw/2,6),sr.width-bw-6);
  let top=br.top-sr.top-bh-14;
  if(top<6){top=br.bottom-sr.top+12;bub.classList.add('below')}
  bub.style.left=left+'px';bub.style.top=top+'px';
  bub.style.setProperty('--tx',Math.min(Math.max(cx-left,18),bw-18)+'px');
  return true;
}
let bubFor=null;
window.addEventListener('resize',()=>{if(playing&&bubFor)placeBubble(bubFor)});
function step(){
  const lines=GAENGE[gang][table],cap=$('cap');
  Object.values(busts).forEach(b=>b.classList.remove('talk'));
  bub.style.display='none';bubFor=null;
  if(idx>=lines.length){cap.style.display='none';playing=false;renderChoice();return}
  const [w,t,o]=lines[idx];const last=idx===lines.length-1;
  const more=last?'Ende des Gangs':'Weiter ▸';
  if(w==='*'){
    cap.innerHTML=`<i>${esc(t)}</i><span class="more">${more}</span>`;cap.style.display='block';
    logAdd(`<p class="st">${esc(t)}</p>`);
  }else{
    cap.style.display='none';
    logAdd(`<p><b>${esc(w)}:</b> ${esc(t)}</p>`);
    const id=WER[w];
    bub.innerHTML=`<b>${esc(w)}</b>${esc(t)}<span class="more">${more}</span>`;
    if(id&&busts[id])busts[id].classList.add('talk');
    bubFor=id;
    if(!id||!placeBubble(id)){cap.innerHTML=`<b>${esc(w)}:</b>${esc(t)}<span class="more">${more}</span>`;cap.style.display='block';bub.style.display='none'}
  }
  if(o){if(o.n)addNote(o.n[0],o.n[1]);if(o.f){flags.add(o.f);save()}}
}
$('cap').onclick=()=>{if(playing){idx++;step()}};
$('bubble').onclick=()=>{if(playing){idx++;step()}};
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&playing&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();idx++;step()}});
function nextGang(){
  gang++;table=null;
  Object.values(busts).forEach(b=>b.classList.remove('dim','talk'));bub.style.display='none';
  $('tblA').classList.remove('hear');$('tblB').classList.remove('hear');
  if(gang>=3){finish();return}
  renderChoice();
}
function finish(){
  over=true;
  const heardA=choices.filter(c=>c==='A').length;
  $('storytext').textContent='Hartmann und Quill haben den Wagen verlassen, die anderen Gäste lösen sich nach und nach auf. Der Abend ist vorbei. Ich habe '+notes.size+' Beobachtungen im Tagebuch. '+(heardA===3?'Ich habe den ganzen Abend am Tisch der drei Herren gesessen.':heardA===0?'Ich habe den ganzen Abend am anderen Tisch gesessen, vom Tisch der drei Herren habe ich wenig mitbekommen.':'Ich habe den Abend zwischen beiden Tischen verbracht und nicht alles gehört.');
  renderChoice();
  const b=document.createElement('button');b.className='go';b.textContent='Weiter zu den Abteilen';
  b.onclick=()=>{
    const d={type:'szene-ende',szene:3,flags:[...flags],notizen:[...notes.keys()],gaenge:choices.slice()};
    let h=false;
    try{if(typeof window.onSzeneEnde==='function'){window.onSzeneEnde(d);h=true}}catch(e){}
    try{if(window.parent&&window.parent!==window){window.parent.postMessage(d,'*');h=true}}catch(e){}
    try{window.dispatchEvent(new CustomEvent('szene-ende',{detail:d}))}catch(e){}
    if(!h){$('ghint').textContent='Der Abend ist beendet. Die Notizen sind gespeichert.';setTimeout(()=>{location.href=NEXT},600)}
    b.disabled=true;
  };
  $('gbtns').appendChild(b);
}

/* ===== Hotspots ===== */
const fly=$('flyout'),stage=$('stage'),seen=new Set();
HOTS.forEach(h=>{
  const d=document.createElement('div');d.className='hs'+(h.noise?' noise':'');d.id='hs-'+h.id;
  d.style.cssText=`left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
  const avail=()=>h.noise||flags.has(h.need);
  const refresh=()=>d.classList.toggle('avail',avail());
  d._r=refresh;
  d.addEventListener('mouseenter',()=>{
    if(!stage.classList.contains('m-glimmen'))return;
    fly.textContent=h.name;fly.style.display='block';
    const r=stage.getBoundingClientRect(),dr=d.getBoundingClientRect();
    let x=dr.right-r.left+8;if(x+300>r.width)x=dr.left-r.left-300;fly.style.left=Math.max(4,x)+'px';fly.style.top=Math.max(4,dr.top-r.top)+'px'});
  d.addEventListener('mouseleave',()=>fly.style.display='none');
  d.addEventListener('click',e=>{
    e.stopPropagation();fly.style.display='none';
    const t=avail()?h.txt:'Dort ist im Moment nichts Auffälliges zu sehen.';
    if(avail()&&h.n)addNote(h.n[0],h.n[1]);
    if(avail())d.classList.add('seen');
    logAdd(`<p class="st">Ich sehe genauer hin: ${esc(t)}</p>`);
    const cap=$('cap');if(!playing){cap.innerHTML=`<i>${esc(t)}</i>`;cap.style.display='block';clearTimeout(cap._t);cap._t=setTimeout(()=>{if(!playing)cap.style.display='none'},3500)}
  });
  $('hots').appendChild(d);refresh();
});
setInterval(()=>document.querySelectorAll('.hs').forEach(d=>d._r&&d._r()),400);

/* ===== Hinweismodus ===== */
function setMode(m){
  stage.classList.remove('m-glimmen','m-lupe','m-keine');stage.classList.add('m-'+m);
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===m));
  $('mhint').textContent={glimmen:'Glimmen: Anklickbares schimmert, Namen erscheinen beim Darüberfahren.',lupe:'Lupe: Nur der Mauszeiger wird zur Lupe, sobald etwas anklickbar ist.',keine:'Keine: Keine Rückmeldung. Du musst selbst suchen.'}[m];
  fly.style.display='none';
  try{localStorage.setItem('eid_hinweis',m)}catch(e){}
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
let sm='lupe';try{sm=localStorage.getItem('eid_hinweis')||'lupe'}catch(e){}
setMode(['glimmen','lupe','keine'].includes(sm)?sm:'lupe');

$('storytext').textContent=EINSTIEG;
renderChoice();
