<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szene 5 – Bahnhof Lyon</title>
<style>
:root{--bg:#14110d;--paper:#f1e6cf;--ink:#2a1f14;--gold:#c9a24a;--red:#8a1f2b;--green:#2f6b3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}
header{padding:10px 16px;border-bottom:2px solid var(--gold);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:18px;letter-spacing:2px;color:var(--gold)}
header span{font-size:13px;opacity:.8}
main{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
#stage{position:relative;flex:1 1 640px;max-width:1100px;aspect-ratio:1537/1023;background:#221c14;border:3px solid #000;box-shadow:0 0 0 2px var(--gold);
cursor:default;--lens:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><circle cx='14' cy='14' r='10' fill='rgba(255,240,200,.25)' stroke='black' stroke-width='4'/><circle cx='14' cy='14' r='10' fill='none' stroke='%23c9a24a' stroke-width='2'/><line x1='21' y1='21' x2='33' y2='33' stroke='black' stroke-width='6' stroke-linecap='round'/><line x1='21' y1='21' x2='33' y2='33' stroke='%23c9a24a' stroke-width='3' stroke-linecap='round'/></svg>") 14 14,zoom-in}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.hs{position:absolute;border:2px solid transparent;border-radius:10px;transition:.15s;z-index:2}
.hs.obj{border-radius:6px}
.m-glimmen .hs:hover{border-color:var(--gold);background:rgba(201,162,74,.12)}
.m-glimmen .hs.seen{border-color:rgba(47,107,58,.6)}
.m-glimmen .hs:not(.seen){animation:gl 2.4s ease-in-out infinite}
@keyframes gl{0%,100%{box-shadow:none}50%{box-shadow:0 0 12px rgba(255,217,138,.65)}}
.m-glimmen .hs,.m-lupe .hs{cursor:var(--lens,zoom-in)}
.hs .tag{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;background:var(--ink);color:var(--paper);
border:1px solid var(--gold);padding:2px 8px;font:12px/1.4 Georgia,serif;border-radius:3px;opacity:0;pointer-events:none;transition:.15s;z-index:3}
.m-glimmen .hs:hover .tag,.m-glimmen.show .hs .tag{opacity:1}
.hs .num{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font:bold 12px/20px Georgia;text-align:center;opacity:0;border:1px solid #fff}
.m-glimmen.show .hs .num{opacity:1}
.hs.seen .num{background:var(--green)}
.hs.talk{border-color:var(--gold);background:rgba(201,162,74,.18);box-shadow:0 0 14px var(--gold)}
#flyout{position:absolute;z-index:5;max-width:280px;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.5);
padding:8px 10px;font:14px/1.4 Georgia,serif;border-radius:4px;display:none;pointer-events:none}
#flyout b{display:block;color:var(--red);font-size:15px}
aside{flex:0 1 360px;min-width:270px;display:flex;flex-direction:column;gap:12px}
.box{background:#201a13;border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.box h2{margin:0 0 6px;font-size:14px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
#story,#talk{font-size:15px;line-height:1.5;background:var(--paper);color:var(--ink)}
#story h2,#talk h2{color:var(--red)}
#talk{display:none}
#talk .rolle{font-size:12px;font-style:italic;opacity:.8;margin-bottom:4px}
#talk .obs{font-size:14px;border-left:3px solid var(--gold);padding-left:8px;margin:6px 0}
#log p{margin:6px 0}
#log .q{color:#5a4a30;font-style:italic}
#log b{color:var(--red)}
#opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
#opts button,#choices button,#close{text-align:left}
button{background:var(--ink);color:var(--paper);border:1px solid var(--gold);padding:6px 10px;font:13px Georgia;border-radius:4px;cursor:pointer}
button:hover{background:#3a2c1c}
button.sel{background:var(--gold);color:var(--ink);font-weight:bold}
#close{margin-top:8px;opacity:.85}
#choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.row label{font-size:13px;opacity:.85}
#diary{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.4}
#diary li{padding:5px 0;border-bottom:1px dashed #5a4a30}
#diary li:last-child{border:0}
#diary .empty{opacity:.6;font-style:italic}

</style></head><body>

 {id:"clarissa",name:"Clarissa Whitlock",rolle:"junge Reisebegleiterin",x:2,y:29,w:17.5,h:71,
  obs:"Das grüne Kleid sitzt tadellos, nur die Finger zupfen an der Brosche. Sie sieht zu mir, dann schnell wieder weg.",
  opts:[
   {q:"Geht es Ihnen gut, Fräulein Whitlock?",a:[["Clarissa","Ich habe noch nie einen Toten gesehen... Gestern am Bahnsteig hat Herr Hartmann mir noch zugenickt. Es kommt mir vor wie ein schlechter Traum."]]},
   {q:"Wo waren Sie gestern Nacht?",a:[["Clarissa","In meinem Abteil, Herr Doktor. Ich habe gelesen und bin früh eingeschlafen."]],n:[["clarissa_aussage","Clarissa behauptet, den ganzen Abend in ihrem Abteil gewesen zu sein."]]},
   {q:"Professor Fenwick hat Sie erwähnt.",req:["fenwick_besucht"],a:[["Clarissa","(sie senkt den Blick) Dann will ich nicht länger lügen. Ich war bei ihm, seine Käfer sind wunderbar. Ich wollte nur nicht, dass man mich eine Frau ohne Anstand nennt, so kurz nach dem Tod meiner Tante."],[ICH,"Und auf dem Rückweg?"],["Clarissa","Ich kam an Hartmanns Abteil vorbei und hörte drinnen einen dumpfen Schlag. Ich dachte, ein Koffer sei umgefallen."]],n:[["clarissa_wahrheit","Clarissa war bei Fenwick und hörte auf dem Rückweg einen dumpfen Schlag aus Hartmanns Abteil."]]},
   {q:"Was haben Sie an Hartmann bemerkt?",a:[["Clarissa","Er hielt seine Mappe fest wie ein Kind den Teddy. Und dieser Herr Quill ist ihm nicht von der Seite gewichen. Er sah aus, als hätte er etwas Wichtiges verlegt."]]}
  ]},
 {id:"wyss",name:"Dr. Wyss (ich)",rolle:"Armeearzt aus der Schweiz",x:16.5,y:28,w:17.5,h:72,
  obs:"Das bin ich. In meinem Koffer liegt der Revolver aus meiner Militärzeit. Ich bin Arzt, kein Detektiv, aber der Schaffner hat mich gebeten, einen Blick auf den Toten zu werfen.",opts:[]},
 {id:"ashworth",name:"Lady Ashworth",rolle:"Reisende, hört mehr als sie sagt",x:34.5,y:32,w:20.5,h:68,
  obs:"Bordeauxrot, die Hand erhoben wie jemand, der gleich etwas sagen will, nach dem keiner gefragt hat.",
  opts:[
   {q:"Man sagte mir, Sie hören viel.",a:[["Lady Ashworth","Beim Dessert hat Hartmann den Major vor allen Gästen angefahren, es ging um Zünder und Prüfungen. Der Major wurde rot wie ein Hummer. Dann sagte Hartmann leiser, in Richtung seines Sekretärs, er werde die Unterlagen heute Nacht durchgehen, jede Zeile. Dann wisse man, wer gefehlt habe."],[ICH,"Und wie reagierte sein Sekretär?"],["Lady Ashworth","Er erstarrte. Nur einen Augenblick, dann lächelte er wieder."]],n:[["streit","Beim Dessert Streit Hartmann–Major wegen der Zünder; Hartmann kündigte in Quills Richtung an, heute Nacht die Unterlagen durchzugehen, jede Zeile (Quill erstarrte kurz)."]]},
   {q:"Was war mit dem Revolver?",a:[["Lady Ashworth","Hartmann ließ den Major sein neues Modell in die Hand nehmen, eine Vorführung, damit der Major sich keine Dummheiten einfallen lässt. Der Major schmunzelte. Dann steckte Hartmann das Etui wieder ein, und Herr Quill sah ihm nach wie ein Hund dem Knochen."]],n:[["revolver_vorf","Hartmann zeigte Picard beim Essen sein neues Revolvermodell als Demonstration, Picard schmunzelte; Hartmann steckte das Etui wieder ein, Quill folgte ihm mit dem Blick."]]},
   {q:"Und der Wein?",a:[["Lady Ashworth","Der Sekretär bot Hartmann eine Flasche aus dem Willkommenskorb an. Hartmann lehnte ab: Er trinke heute nichts, was er nicht selbst geöffnet habe. Herr Quill lächelte gequält und stellte die Flasche zur Seite."]],n:[["wein","Quill bot Hartmann Wein aus dem Willkommenskorb an. Hartmann lehnte ab: Er trinke nichts, was er nicht selbst geöffnet habe."]]},
   {q:"Haben Sie vom Abteiltausch gehört?",a:[["Lady Ashworth","Der Schaffner jammerte auf dem Gang: Sieben gegen acht, das gebe nur Ärger. Der Sekretär habe es so gewollt."]],n:[["tausch_ashworth","Lady Ashworth: Der Abteiltausch 7/8 ging vom Sekretär (Quill) aus."]]},
   {q:"Wie schätzen Sie Herrn Quill ein?",a:[["Lady Ashworth","Zu höflich. Wer Tag und Nacht an der Seite eines Mannes steht und ihm nie widerspricht, hat entweder Liebe oder Pläne."]]}
  ]},
 {id:"schaffner",name:"Der Schaffner",rolle:"Compagnie Internationale des Wagons-Lits",x:56.5,y:34,w:9,h:50,
  obs:"Er dreht seine Mütze in den Händen und sieht immer wieder zum Gepäckstapel.",
  opts:[
   {q:"Wie haben Sie den Toten gefunden?",a:[["Schaffner","Ich wollte am Morgen wecken, keine Antwort. Die Tür ließ sich nicht öffnen. Ich habe das Fenster eingeschlagen und bin hinein, Herr Doktor."]],n:[["gang","Schaffner: Die Tür ließ sich nicht öffnen, er stieg durchs eingeschlagene Fenster ein."]]},
   {q:"Haben Sie etwas im Abteil angefasst?",a:[["Schaffner","Nein, nichts! Ich habe ihn liegen lassen, wie er lag, und bin sofort wieder hinaus. Das war mir nicht geheuer."]],n:[["unberuehrt","Schaffner beteuert, Leiche und Abteil nicht berührt zu haben (der Tatort ist also im Fundzustand)."]]},
   {q:"Warum haben Sie die Gendarmerie nicht gerufen?",a:[["Schaffner","Ein Unglücksfall, nichts weiter. Die Compagnie sieht Verspätungen nicht gern."],[ICH,"Er sieht dabei zum Gepäck hinüber."]],n:[["unfall","Der Schaffner will einen Unfall und keine Gendarmerie."]]},
   {q:"Wer hat den Abteiltausch eingefädelt?",a:[["Schaffner","Herr Quill, schon am Bahnsteig in Paris. Herr Hartmann hat genickt. Ich habe nur die Platzschilder getauscht."]],n:[["tausch_schaffner","Schaffner: Quill hat den Abteiltausch 7/8 schon in Paris angestoßen."]]},
   {q:"Was hat es mit dem Willkommenskorb auf sich?",a:[["Schaffner","Der war für Nummer sieben gebucht, den hatte ich schon hingestellt. Dann tauschen die Herren, und ich darf ihn nach acht schleppen, zu Herrn Hartmann. Diese Herren wissen nie, was sie wollen."]],n:[["korb_schaffner","Der Willkommenskorb war für Abteil 7 gebucht; nach dem Tausch trug der Schaffner ihn nach Abteil 8 zu Hartmann und fluchte darüber."]]},
   {q:"Was ist mit der unbeschrifteten Kiste im Gepäck?",req:["kiste"],a:[["Schaffner","Frachtgut der Compagnie, Herr Doktor. Mit den Fahrgästen hat das nichts zu tun!"],[ICH,"Sein Blick sagt etwas anderes. Mit dem Mord hat das wohl nichts zu tun, aber er hat Angst vor der Gendarmerie."]],n:[["schmuggel","Der Schaffner schützt eine Kiste (vermutlich Schmuggel, wohl ohne Bezug zum Mord)."]]}
  ]},
 {id:"fenwick",name:"Professor Fenwick",rolle:"Naturforscher, Käfersammler",x:65.5,y:33,w:10,h:52,
  obs:"Den Hut tief, den Rücken zu mir. Er scheint dem Schaffner mehr zuzuhören als zu sprechen.",
  opts:[
   {q:"Was führt Sie nach Marseille, Professor?",a:[["Fenwick","Eine Expedition, Herr Doktor. Fünfzehn Jahre Käferforschung wollen eingeschifft werden. Ein Mord kommt mir da ungelegen."]]},
   {q:"Sie waren gestern noch lange wach?",a:[["Fenwick","Ich schlafe wenig. Fräulein Whitlock hatte die Güte, meine Sammlung zu bewundern, bis spät am Abend. Ein reizendes Gespräch."]],n:[["fenwick_besucht","Fenwick: Clarissa war am Abend lange in seinem Abteil."]]},
   {q:"Haben Sie in der Nacht etwas gehört?",a:[["Fenwick","Nur den Gegenzug, Herr Doktor. Er war so laut, dass man nichts anderes hörte."]],n:[["fenwick_nichts","Fenwick hörte wegen des Gegenzugs nichts anderes."]]},
   {q:"Tragen die Herren hier eigentlich Stöcke?",a:[["Fenwick","Drei, Herr Doktor: Herr Hartmann, Major Picard und Pater Anselm tragen alle einen Stock mit Knauf. Ich achte auf solche Dinge, seit mir mein Käfernetz einmal zwischen die Stöcke geriet."]],n:[["stoecke","Fenwick: Drei Herren tragen einen Stock mit Knauf: Hartmann, Major Picard und Pater Anselm."]]},
   {q:"Ist Ihnen am Schaffner etwas aufgefallen?",a:[["Fenwick","Er bewacht eine Kiste im Gepäckwagen wie ein Drache. Ich habe gesehen, wie er sie hinter anderen Koffern versteckt hat."]],n:[["kiste","Im Gepäck: unbeschriftete Kiste mit widersprüchlichen Frachtpapieren (Schaffner?)."]]}
  ]},
 {id:"quill",name:"Mr. Quill",rolle:"Hartmanns Privatsekretär",x:76.5,y:34,w:8.5,h:38,

  opts:[

const ALLE=[...ORTE,...FIGUREN];

/* ===== Spiellogik ===== */
const flags=new Set(),asked=new Set(),notes=new Map();let noteCount=0;
const stage=document.getElementById('stage'),fly=document.getElementById('flyout');
const diary=document.getElementById('diary'),talk=document.getElementById('talk');
let hard=false,mode='lupe';
/* Gemeinsames Tagebuch aller Kapitel: localStorage 'eid_diary' = [[Schlüssel, Text], ...], 'eid_notes' = Schlüssel */
function store(){try{
  const a=JSON.parse(localStorage.getItem('eid_diary')||'[]');
  notes.forEach((t,k)=>{if(!a.some(x=>x[0]===k))a.push([k,t])});
  localStorage.setItem('eid_diary',JSON.stringify(a));
  const n=new Set(JSON.parse(localStorage.getItem('eid_notes')||'[]'));notes.forEach((t,k)=>n.add(k));
  localStorage.setItem('eid_notes',JSON.stringify([...n]));
}catch(e){}}
function addNote(key,txt,quiet){
  if(flags.has(key))return;flags.add(key);notes.set(key,txt);
  if(!quiet)noteCount++;
  window.EID_NOTES=[...flags];
  if(!diary.querySelector('li:not(.empty)'))diary.innerHTML='';
  const li=document.createElement('li');li.textContent=txt;diary.appendChild(li);
  if(!quiet){store();checkEnd()}
}
function checkEnd(){
  const ch=document.getElementById('choices');
  if(noteCount>=MIN_NOTES&&!ch.querySelector('button')){
    const b=document.createElement('button');b.textContent='Weiter zu Szene 6: Quills Abteil';
    b.onclick=()=>{store();location.href=NEXT};
    ch.appendChild(b);
  }
  const o7=document.getElementById('hs-abteil7');if(o7&&noteCount>=MIN_NOTES)o7.classList.add('seen');
  if(document.getElementById('opts')&&window.CUR_F&&CUR_F.id==='abteil7')renderOpts(CUR_F);
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function line(sp,t){return `<p><b>${esc(sp)}:</b> ${esc(t)}</p>`}
function renderOpts(f){
  const box=document.getElementById('opts');box.innerHTML='';
  let any=false;
  f.opts.forEach((o,i)=>{
    const k=f.id+':'+i;
    if(asked.has(k)||(o.req||[]).some(r=>!flags.has(r))||(o.min&&noteCount<o.min))return;
    any=true;const b=document.createElement('button');b.textContent=o.q;
    b.onclick=()=>{
      const log=document.getElementById('log');
      if(o.act==='goto'){
        log.insertAdjacentHTML('beforeend',`<p class="q">${esc(ICH)}: ${esc(o.q)}</p>`);
        o.ok.forEach(([sp,t])=>log.insertAdjacentHTML('beforeend',line(sp,t)));
        store();setTimeout(()=>{location.href=o.to},900);return;
      }
      asked.add(k);
      log.insertAdjacentHTML('beforeend',`<p class="q">${esc(ICH)}: ${esc(o.q)}</p>`);
      o.a.forEach(([s,t])=>log.insertAdjacentHTML('beforeend',line(s,t)));
      (o.n||[]).forEach(([key,txt])=>addNote(key,txt));
      renderOpts(f);
    };
    box.appendChild(b);
  });
  if(!any&&f.opts.length)box.innerHTML='<i style="font-size:13px">Dazu gibt es im Moment nichts mehr zu fragen.</i>';
}
function openTalk(f,el){
  window.CUR_F=f;
  document.querySelectorAll('.hs.talk').forEach(e=>e.classList.remove('talk'));
  el.classList.add('talk');el.classList.add('seen');
  document.getElementById('speaker').textContent=f.name;
  document.getElementById('rolle').textContent=f.rolle;
  document.getElementById('obs').textContent=f.obs;
  document.getElementById('log').innerHTML='';
  renderOpts(f);talk.style.display='block';
  talk.scrollIntoView({block:'nearest',behavior:'smooth'});
}
document.getElementById('close').onclick=()=>{talk.style.display='none';document.querySelectorAll('.hs.talk').forEach(e=>e.classList.remove('talk'))};

ALLE.forEach((f,i)=>{
  const d=document.createElement('div');d.className='hs'+(f.obj?' obj':'');d.id='hs-'+f.id;
  d.style.cssText=`left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%`;
  if(f.obj)d.style.zIndex=1;
  d.innerHTML=`<span class="num">${i+1}</span><span class="tag">${f.name}</span>`;
  const show=()=>{
    if(mode!=='glimmen')return;
    fly.innerHTML=`<b>${f.name}</b><i style="font-size:12px">${f.rolle}</i><br>${f.obs}`;
    fly.style.display='block';
    const r=stage.getBoundingClientRect(),dr=d.getBoundingClientRect();
    let x=dr.right-r.left+8;if(x+290>r.width)x=dr.left-r.left-290;if(x<4)x=4;
    let y=Math.min(Math.max(dr.top-r.top,4),r.height-150);
    fly.style.left=x+'px';fly.style.top=y+'px';
  };
  d.addEventListener('mouseenter',show);
  d.addEventListener('mouseleave',()=>fly.style.display='none');
  d.addEventListener('click',e=>{e.stopPropagation();fly.style.display='none';openTalk(f,d)});
  stage.appendChild(d);
});
stage.addEventListener('click',()=>fly.style.display='none');
const btnNames=document.getElementById('toggleNames');
btnNames.onclick=function(){
  const on=stage.classList.toggle('show');this.textContent=on?'Beschriftungen ausblenden':'Alle zeigen'};

/* Hinweismodus (wie in Szene 3): Glimmen = Anklickbares schimmert, Namen und Kurzinfo beim Darüberfahren;
   Lupe = nur der Mauszeiger wird zur Lupe; Keine = keine Rückmeldung */
function setMode(m){
  mode=m;hard=(m==='keine');
  stage.classList.remove('m-glimmen','m-lupe','m-keine');stage.classList.add('m-'+m);
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===m));
  document.getElementById('namesRow').style.display=m==='glimmen'?'flex':'none';
  fly.style.display='none';
  if(m!=='glimmen'){stage.classList.remove('show');btnNames.textContent='Alle zeigen'}
  document.getElementById('hint').textContent={glimmen:'Glimmen: Anklickbares schimmert. Lupe über eine Figur oder einen Ort bewegen zeigt den Namen. Grüner Rand = schon besprochen.',lupe:'Lupe: Nur der Mauszeiger wird zur Lupe, sobald etwas anklickbar ist.',keine:'Keine: Keine Rückmeldung. Suche mit der Maus und klicke auf alles, was verdächtig wirkt.'}[m];
  try{localStorage.setItem('eid_hinweis',m)}catch(e){}
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
try{JSON.parse(localStorage.getItem('eid_diary')||'[]').forEach(([k,t])=>addNote(k,t,true))}catch(e){}
let saved='lupe';try{saved=localStorage.getItem('eid_hinweis')||'lupe'}catch(e){}
setMode(['glimmen','lupe','keine'].includes(saved)?saved:'lupe');

document.getElementById('storytext').textContent=
 'Lyon, früher Morgen. Der Nachtzug steht länger als im Fahrplan, der Dampf hängt unter dem Glasdach. In Wagen 7 liegt Herr Hartmann tot in Abteil 8. Der Schaffner spricht von einem Unfall, ich bin Arzt und glaube ihm nicht. Bevor jemand das Abteil aufräumt oder die Reisenden weiterfahren lassen will, habe ich Zeit zum Fragen und Hinsehen. Anklicken: Figuren befragen, Orte untersuchen.';
