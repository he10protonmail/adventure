<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szene 2 – Bahnhof Paris</title>
<style>
:root{--bg:#14110d;--paper:#f1e6cf;--ink:#2a1f14;--gold:#c9a24a;--red:#8a1f2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Georgia,'Times New Roman',serif}
header{padding:10px 16px;border-bottom:2px solid var(--gold);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:18px;letter-spacing:2px;color:var(--gold)}
header span{font-size:13px;opacity:.8}
main{display:flex;gap:12px;padding:12px;align-items:flex-start;flex-wrap:wrap}
#stage{position:relative;flex:1 1 640px;max-width:1100px;line-height:0;border:3px solid #000;box-shadow:0 0 0 2px var(--gold);
cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><circle cx='14' cy='14' r='10' fill='rgba(255,240,200,.25)' stroke='black' stroke-width='4'/><circle cx='14' cy='14' r='10' fill='none' stroke='%23c9a24a' stroke-width='2'/><line x1='21' y1='21' x2='33' y2='33' stroke='black' stroke-width='6' stroke-linecap='round'/><line x1='21' y1='21' x2='33' y2='33' stroke='%23c9a24a' stroke-width='3' stroke-linecap='round'/></svg>") 14 14,zoom-in}
#stage img{width:100%;height:auto;display:block}
.hs{position:absolute;border:2px solid transparent;border-radius:10px;transition:.15s}
.hs:hover,.hs.on{border-color:var(--gold);background:rgba(201,162,74,.12)}
.hs .tag{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);white-space:nowrap;background:var(--ink);color:var(--paper);
border:1px solid var(--gold);padding:2px 8px;font:12px/1.4 Georgia,serif;border-radius:3px;opacity:0;pointer-events:none;transition:.15s}
.hs:hover .tag,.show .hs .tag{opacity:1}
.hs .num{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font:bold 12px/20px Georgia;text-align:center;opacity:0;border:1px solid #fff}
.show .hs .num{opacity:1}
.hs.seen .num{background:#2f6b3a}
#flyout{position:absolute;z-index:5;max-width:280px;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.5);
padding:8px 10px;font:14px/1.4 Georgia,serif;border-radius:4px;display:none;pointer-events:none}
#flyout b{display:block;color:var(--red);font-size:15px}
aside{flex:0 1 330px;min-width:260px;display:flex;flex-direction:column;gap:12px}
.box{background:#201a13;border:1px solid var(--gold);border-radius:6px;padding:10px 12px}
.box h2{margin:0 0 6px;font-size:14px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
#story{font-size:15px;line-height:1.5;background:var(--paper);color:var(--ink)}
#story h2{color:var(--red)}
button{background:var(--ink);color:var(--paper);border:1px solid var(--gold);padding:6px 10px;font:13px Georgia;border-radius:4px;cursor:pointer}
button:hover{background:#3a2c1c}
#diary{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.4}
#diary li{padding:5px 0;border-bottom:1px dashed #5a4a30}
#diary li:last-child{border:0}
#diary .empty{opacity:.6;font-style:italic}
#choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

#bubble{position:absolute;z-index:6;width:270px;top:3%;background:var(--paper);color:var(--ink);border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.5);padding:8px 12px 6px;font:15px/1.4 Georgia,serif;border-radius:8px;display:none;cursor:pointer}
#bubble b{display:block;color:var(--red);font-size:14px;margin-bottom:2px}
#bubble .more{text-align:right;font-size:12px;color:#6a5a40;margin-top:4px}
.hs.talk{border-color:var(--gold);background:rgba(201,162,74,.18);box-shadow:0 0 14px var(--gold)}
</style></head><body>

 {id:"wyss",   name:"Dr. Wyss",         rolle:"Schweizer Armeearzt (du)", x:9.3, y:24, w:19.5,h:76,
  text:"Das bin ich. In meinem Koffer liegt der Revolver aus meiner Militärzeit. Afrika und Asien sind gefährlich, aber Europa hat auch seine Tücken.",

 {id:"anselm", name:"Pater Anselm",     rolle:"Mitreisender, ruhig und aufmerksam", x:23, y:32, w:9.5,h:56,
  text:"Ein stiller Herr im grünen Mantel. Die Hand am Bart, der Blick wach: Er sieht mehr, als er sagt.",
  tag:"Ich habe bemerkt, dass Pater Anselm die Gruppe still und aufmerksam beobachtet."},
 {id:"quill",  name:"Mr. Quill",        rolle:"aus Hartmanns Umfeld", x:27.6,y:32, w:15.4,h:68,
  text:"Er steht dicht neben Hartmann und lässt ihn nicht aus den Augen. Ein schmaler, gepflegter Mann mit Aktentasche, der Hartmann kaum von der Seite weicht.",
  tag:"Ich habe bemerkt, dass Quill Hartmann nicht von der Seite weicht."},
 {id:"hartmann",name:"Herr Hartmann",   rolle:"Waffenfabrikant, Hartmann & Gross", x:43, y:31.5,w:14.6,h:57,
  text:"Er drückt eine Mappe an sich, als dürfe sie keinen Moment aus seiner Reichweite. Ein Mann, der es gewohnt ist, dass man ihm Platz macht.",
  tag:"Ich habe bemerkt, dass Hartmann eine Mappe nicht aus der Hand gibt."},
 {id:"clarissa",name:"Clarissa Whitlock",rolle:"junge Reisebegleiterin", x:53.5,y:34, w:17.5,h:66,
  text:"Ihre Tante ist gerade gestorben, doch das Kleid ist alles andere als schwarz. Sie lächelt jedem Herrn im Umkreis zu.",
  tag:"Ich habe bemerkt, dass Clarissa mit allen Herren flirtet und kaum Trauer zeigt."},
 {id:"schaffner",name:"Der Schaffner",   rolle:"Compagnie Internationale des Wagons-Lits", x:69.8,y:33, w:9.4,h:48,
  text:"Er schaut häufiger auf die Gepäckstapel als auf die Fahrgäste. Ein Dienst nach Vorschrift sieht anders aus.",
  tag:"Ich habe bemerkt, dass der Schaffner auffallend auf das Gepäck achtet."},
 {id:"fenwick",name:"Professor Fenwick",rolle:"Naturforscher, Käfersammler", x:80.6,y:36.5,w:9,h:44,
  text:"Ein bärtiger Herr im blauen Mantel. Er hält seine Kiste, als wäre sie aus Glas, und mustert Clarissa kurz, aber eine Spur länger als nötig.",

 {id:"picard", name:"Major Picard",     rolle:"französischer Offizier", x:87,y:31.5,w:13,h:56,

 {id:"ashworth",name:"Lady Ashworth",    rolle:"Reisende, liest Le Petit Journal", x:0,y:47,w:14.6,h:41,

const DIALOG=[
 ["schaffner","Voiture sept, Messieurs-dames! Abfahrt in zehn Minuten. Und bitte: Gepäck deutlich beschriften!"],
 ["wyss","Dr. Wyss, Arzt aus der Schweiz. Falls jemandem unterwegs unwohl wird: Ich bin in Wagen sieben."],
 ["hartmann","Hartmann. Hartmann & Gross, Waffen. Ich reise nie ohne meine Unterlagen und nie ohne Termin."],
 ["quill","Herr Hartmann, ein Vorschlag: Tauschen wir die Abteile. Meines liegt in der Wagenmitte, Ihres neben der Tür, wo ständig jemand vorbeigeht. Für Ihre Papiere wäre Ruhe besser.",

 ["hartmann","Meinetwegen. Hauptsache, die Tür schließt ordentlich.",

 ["fenwick","Professor Fenwick, Naturforscher. In dieser Kiste liegt meine Käfersammlung, fünfzehn Jahre Arbeit. Sie muss unbedingt sanft gelagert werden: nicht stapeln, nicht stürzen, bitte!",

 ["ashworth","Lady Ashworth. Ich lese Zeitung und höre zu. Beides ist lehrreich."],
 ["anselm","Pater Anselm. Ich fahre nach Marseille. Möge die Nacht ruhig bleiben."],
 ["wyss","Eine ruhige Nacht. Ich hoffe es auch. Der Schaffner pfeift schon."]

const STORY=[
 {t:"Paris, Abend. Auf Gleis 4 wartet der blaue Zug der Compagnie Internationale des Wagons-Lits. Nachtfahrt nach Marseille, mit Halt in Lyon. Ich, Dr. Wyss, Armeearzt aus der Schweiz, habe mein Billett, meinen Koffer und eine Reisegesellschaft, die ich mir nicht ausgesucht habe. Mit der Lupe kann ich jeden Reisenden ansehen. Oder ich höre einfach zu.",
  c:[["Dem Gespräch zuhören","dialog"]]},
 {t:"",c:[]},
 {t:"Der Pfiff ertönt. Dampf zieht über den Bahnsteig, die Koffer werden verladen. Der Schaffner ruft: „En voiture, messieurs-dames!“",
  c:[["Einsteigen",null]]}
];
const NEXT='szene3_speisewagen.html'; /* nächstes Kapitel: Speisewagen */
let step=0;const seen=new Set();
const stage=document.getElementById('stage'),fly=document.getElementById('flyout');
const diary=document.getElementById('diary');
const bub=document.createElement('div');bub.id='bubble';stage.appendChild(bub);
let di=-1;
/* Gemeinsames Tagebuch aller Kapitel: localStorage 'eid_diary' = [[Schlüssel, Text], ...] */
const shown=new Set();
function addDiary(txt,key){
  if(shown.has(key))return;shown.add(key);
  if(!diary.querySelector('li:not(.empty)'))diary.innerHTML='';
  const li=document.createElement('li');li.textContent=txt;diary.appendChild(li);
  try{const a=JSON.parse(localStorage.getItem('eid_diary')||'[]');if(!a.some(x=>x[0]===key)){a.push([key,txt]);localStorage.setItem('eid_diary',JSON.stringify(a))}
    const n=JSON.parse(localStorage.getItem('eid_notes')||'[]');if(!n.includes(key)){n.push(key);localStorage.setItem('eid_notes',JSON.stringify(n))}}catch(e){}
}
try{(JSON.parse(localStorage.getItem('eid_diary')||'[]')).forEach(([k,t])=>addDiary(t,k))}catch(e){}
function showLine(){
  document.querySelectorAll('.hs.talk').forEach(e=>e.classList.remove('talk'));
  if(di>=DIALOG.length){bub.style.display='none';step=2;renderStory();return}
  const [id,txt,note]=DIALOG[di];const f=FIGUREN.find(x=>x.id===id);
  document.getElementById('hs-'+id).classList.add('talk');
  bub.innerHTML='<b>'+f.name+'</b>'+txt+'<div class="more">Weiter ▸</div>';
  bub.style.display='block';
  const W=stage.clientWidth;let l=(f.x+f.w/2)/100*W-135;l=Math.max(4,Math.min(W-274,l));bub.style.left=l+'px';
  if(note)addDiary(note,'p_dlg'+di);
}
bub.addEventListener('click',e=>{e.stopPropagation();di++;showLine()});
document.addEventListener('keydown',e=>{if(di>=0&&di<DIALOG.length&&(e.key==='Enter'||e.key===' ')){e.preventDefault();di++;showLine()}});
function renderStory(){
  const s=STORY[step];document.getElementById('storytext').textContent=s.t;
  const ch=document.getElementById('choices');ch.innerHTML='';
  s.c.forEach(([label,next])=>{const b=document.createElement('button');b.textContent=label;
    b.onclick=()=>{
      if(next==='dialog'){di=0;document.getElementById('storytext').textContent='Gespräch am Bahnsteig. Klick auf die Sprechblase oder Enter für die nächste Zeile.';ch.innerHTML='';showLine()}
      else if(next!==null){step=next;renderStory()}
      else location.href=NEXT};
    ch.appendChild(b)});
}
FIGUREN.forEach((f,i)=>{
  const d=document.createElement('div');d.className='hs';d.id='hs-'+f.id;
  d.style.cssText=`left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%`;
  d.innerHTML=`<span class="num">${i+1}</span><span class="tag">${f.name}</span>`;
  const open=e=>{
    fly.innerHTML=`<b>${f.name}</b><i style="font-size:12px">${f.rolle}</i><br>${f.text}`;
    fly.style.display='block';
    const r=stage.getBoundingClientRect(),dr=d.getBoundingClientRect();
    let x=dr.right-r.left+8;if(x+290>r.width)x=dr.left-r.left-290;if(x<4)x=4;
    let y=Math.min(Math.max(dr.top-r.top,4),r.height-140);
    fly.style.left=x+'px';fly.style.top=y+'px';
    if(!seen.has(f.id)){seen.add(f.id);d.classList.add('seen');
      addDiary(f.tag,'p_fig_'+f.id);}
  };
  d.addEventListener('mouseenter',open);
  d.addEventListener('click',e=>{open(e);e.stopPropagation()});
  d.addEventListener('mouseleave',()=>fly.style.display='none');
  stage.appendChild(d);
});
stage.addEventListener('click',()=>fly.style.display='none');
document.getElementById('toggleNames').onclick=function(){
  const on=stage.classList.toggle('show');this.textContent=on?'Figurennamen ausblenden':'Alle Figuren zeigen'};
renderStory();

try{localStorage.setItem('eid_progress',me);var m=+localStorage.getItem('eid_maxch')||0,i=N.indexOf(me)+2;if(i>m)localStorage.setItem('eid_maxch',String(i))}catch(e){}
