<style>

/* ===== Zustandsmodell v2 =====

function xclean(d){const f=xfresh(),o={virtues:{},rel:f.rel,npc:{},done:{}},v=obj(d&&d.virtues);

 o.evlog=(Array.isArray(d&&d.evlog)?d.evlog:[]).filter(e=>e&&typeof e==="object").slice(-EVMAX);
 Object.entries(obj(d&&d.done)).forEach(([k,x])=>{if(x)o.done[k]=1});

/* Spielstand: wird nur in ruhigen Momenten (Szene, Dialog) gespeichert, nie mitten im Kampf oder Kabelraetsel.

function parseSave(j){let d;try{d=JSON.parse(j)}catch(e){return{err:"kein lesbares JSON"}}

 if(d.gameId&&d.gameId!==gameId())return{err:"gehört zu einem anderen Spiel ("+d.gameId+")"};
 const okS=x=>x&&P.scenes[x.scene]&&Array.isArray(x.inv)&&Array.isArray(x.floor)&&x.flags&&typeof x.flags==="object"&&Number.isFinite(x.hp)&&Number.isFinite(x.money);
 if(!okS(d))return{err:"Pflichtfelder fehlen oder die Szene ist unbekannt"};

 const s={...fresh(),...snap({...d,...x}),ck:snap({...k,...xk})};
 s.hp=Math.min(s.hp,CFG.hero.maxHp);if(typeof d.ch==="number")s.ch=d.ch;
 if(d.mode==="dialog"&&P.nodes[d.node]){s.mode="dialog";s.node=d.node}

function saveGame(){try{if(!S||(S.mode!=="scene"&&S.mode!=="dialog"))return;

 if(old&&parseSave(old).s)localStorage.setItem(BAK_KEY,old);

function loadGame(){loadNote="";let j=null;try{j=localStorage.getItem(SAVE_KEY)}catch(e){return null}

 const a=parseSave(j);
 if(a.s){a.s.msg=a.migrated?"Spielstand aus der alten Version übernommen.":"Spielstand fortgesetzt.";return a.s}
 try{localStorage.setItem(BAD_KEY,j)}catch(e){}
 let b=null;try{b=localStorage.getItem(BAK_KEY)}catch(e){}
 const r=b!=null?parseSave(b):null;
 if(r&&r.s){r.s.msg="Der Spielstand war ungültig ("+a.err+"). Der vorherige Stand wurde wiederhergestellt.";return r.s}
 loadNote="Der gespeicherte Spielstand war ungültig ("+a.err+"). Ein neues Spiel wurde begonnen. Die defekten Daten bleiben als Kopie erhalten.";

/* Schutzprüfungen: Ziel einer Szene, eines Dialogs, eines Kampfes oder Rätsels muss existieren */
/* ===== Ereignissystem (Phase B) =====
   Konsequenzen werden nicht mehr direkt im Spielstand geschrieben, sondern als Ereignisse beschrieben:
   {type:"virtue_changed", id:"k1_ehrlich", virtue:"honesty", delta:10}
   {type:"companion_sympathy_changed", id:"...", who:"<Begleiter>", delta:15}
   {type:"relationship_event", id:"...", who:"<Begleiter>", event:"promise_kept"}
   {type:"npc_disposition_changed", id:"...", npc:"<Figur>", to:"friendly"}
   Jedes Ereignis braucht eine stabile ID und wird pro Spielstand hoechstens einmal angewendet (Schutz vor Punktesammeln).
   Eine Liste wird erst vollstaendig geprueft und dann angewendet: ist ein Ereignis ungueltig, wird keines angewendet.
   Ereignisse loesen keine weiteren Ereignisse aus (keine Regelketten).
   Im Plot: ev (Dialogknoten, Hotspot, Option bei Erfolg), evFail (Option bei misslungener Probe), req (Voraussetzung). */
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),isNum=x=>typeof x==="number"&&isFinite(x);
const REL_BASE=["promise_kept","promise_broken","secret_shared","companion_rescued","companion_endangered","disagreement_resolved","trust_lost","trust_restored"];
const relEvents=()=>[...REL_BASE,...(Array.isArray(P.relEvents)?P.relEvents:[])];
const delErr=e=>!isNum(e.delta)||Math.abs(e.delta)>100?"delta muss eine Zahl von -100 bis 100 sein":"";
const FLAGOK=f=>typeof f==="string"&&/^[A-Za-z0-9_]{1,60}$/.test(f)&&!/^__/.test(f),ITEMOK=x=>typeof x==="string"&&x.length>0&&x.length<=60;
const EVT={
 virtue_changed:{chk:(e,rel)=>VIRT.includes(e.virtue)?delErr(e):"unbekannte Tugend "+e.virtue,
  run:e=>{const o=S.virtues[e.virtue],n=clamp100(o+e.delta,o);S.virtues[e.virtue]=n;return{from:o,to:n}}},
 companion_sympathy_changed:{chk:(e,rel)=>has(rel,e.who)?delErr(e):"unbekannter Begleiter "+e.who,
  run:e=>{const r=S.rel[e.who],o=r.sympathy,n=clamp100(o+e.delta,o);r.sympathy=n;return{from:o,to:n}}},
 relationship_event:{chk:(e,rel)=>!has(rel,e.who)?"unbekannter Begleiter "+e.who:relEvents().includes(e.event)?"":"unbekanntes Beziehungsereignis "+e.event,
  run:e=>{const r=S.rel[e.who];r.events.push({e:e.event,ch:S.ch,scene:S.scene,id:e.id,...(e.data?{data:cl(e.data)}:{})});if(r.events.length>EVMAX)r.events.splice(0,r.events.length-EVMAX);return{}}},
 flag_set:{chk:(e,rel)=>FLAGOK(e.flag)?"":"ungültiger Merker "+e.flag,run:e=>{S.flags[e.flag]=1;return{}}},
 flag_clear:{chk:(e,rel)=>FLAGOK(e.flag)?"":"ungültiger Merker "+e.flag,run:e=>{delete S.flags[e.flag];return{}}},
 item_acquired:{chk:(e,rel)=>ITEMOK(e.item)?"":"ungültiger Gegenstandsname",run:e=>{if(!S.inv.includes(e.item))S.inv.push(e.item);return{}}},
 item_removed:{chk:(e,rel)=>ITEMOK(e.item)?"":"ungültiger Gegenstandsname",run:e=>{S.inv=S.inv.filter(x=>x!==e.item);return{}}},
 npc_disposition_changed:{chk:(e,rel)=>!has(P.chars,e.npc)?"unbekannte Figur "+e.npc:DISP.includes(e.to)?"":"unbekannter Zustand "+e.to,
  run:e=>{const o=S.npc[e.npc]||"neutral";S.npc[e.npc]=e.to;return{from:o,to:e.to}}}};
/* Prueft ein einzelnes Ereignis. rel = vorhandene Begleiter. Ergebnis: Fehlertext oder "" */
function evErr(e,rel){if(!e||typeof e!=="object"||Array.isArray(e))return"Ereignis ist kein Objekt";

/* Voraussetzungen (req): ein Objekt mit genau einem Schluessel oder eine Liste davon (alle muessen gelten)

const inR=(x,c)=>isNum(x)&&(c.min!==undefined||c.max!==undefined)&&(c.min===undefined||(isNum(c.min)&&x>=c.min))&&(c.max===undefined||(isNum(c.max)&&x<=c.max));
function condOne(c){if(!c||typeof c!=="object"||Array.isArray(c))return false;const ks=Object.keys(c);if(ks.length!==1)return false;const k=ks[0],v=c[k];
 switch(k){
  case"sym":return !!v&&has(S.rel,v.who)&&inR(S.rel[v.who].sympathy,v);
  case"virt":return !!v&&VIRT.includes(v.name)&&inR(S.virtues[v.name],v);
  case"npc":return !!v&&has(P.chars,v.id)&&[].concat(v.is).includes(S.npc[v.id]||"neutral");
  case"hist":return !!v&&has(S.rel,v.who)&&(v.has!==undefined||v.not!==undefined)&&(v.has===undefined||S.rel[v.who].events.some(e=>e.e===v.has))&&(v.not===undefined||!S.rel[v.who].events.some(e=>e.e===v.not));
  case"done":return typeof v==="string"&&has(S.done,v);
  case"notdone":return typeof v==="string"&&!has(S.done,v);
  case"flag":return typeof v==="string"&&has(S.flags,v)&&!!S.flags[v];
  case"noflag":return typeof v==="string"&&!(has(S.flags,v)&&S.flags[v]);

const condOk=q=>q==null||[].concat(q).every(condOne);
function condErr(q,rel){const out=[];[].concat(q).forEach(c=>{
 if(!c||typeof c!=="object"||Array.isArray(c)||Object.keys(c).length!==1){out.push("Voraussetzung braucht genau einen Schlüssel");return}
 const k=Object.keys(c)[0],v=c[k],rng=()=>(v.min!==undefined&&!isNum(v.min))||(v.max!==undefined&&!isNum(v.max))||(v.min===undefined&&v.max===undefined);
 if(k==="sym"){if(!v||!has(rel,v.who))out.push("sym: unbekannter Begleiter");else if(rng())out.push("sym: min/max fehlen oder sind ungültig")}
 else if(k==="virt"){if(!v||!VIRT.includes(v.name))out.push("virt: unbekannte Tugend");else if(rng())out.push("virt: min/max fehlen oder sind ungültig")}
 else if(k==="npc"){if(!v||!has(P.chars,v.id))out.push("npc: unbekannte Figur");else if(![].concat(v.is).every(x=>DISP.includes(x)))out.push("npc: ungültiger Zustand")}
 else if(k==="hist"){if(!v||!has(rel,v.who))out.push("hist: unbekannter Begleiter");else{[v.has,v.not].forEach(x=>{if(x!==undefined&&!relEvents().includes(x))out.push("hist: unbekanntes Beziehungsereignis "+x)});if(v.has===undefined&&v.not===undefined)out.push("hist: has oder not fehlt")}}

/* Statische Pruefung aller Ereignisse und Voraussetzungen im Plot (wird von checkPlot aufgerufen) */
function checkEvents(){const m=[],rel=xfresh().rel,ids={};

  const j=JSON.stringify(e);if(has(ids,e.id)&&ids[e.id]!==j)m.push(w+": ID "+e.id+" wird mit anderem Inhalt erneut verwendet");ids[e.id]=j})};
 const chkReq=(q,w)=>{if(q!==undefined)condErr(q,rel).forEach(x=>m.push(w+": "+x))};
 Object.entries(P.scenes).forEach(([k,sc])=>(sc.spots||[]).forEach((o,i)=>{const w="Szene "+k+", Hotspot "+i;if(o.ev)chkEv(o.ev,w);chkReq(o.req,w)}));
 Object.entries(P.nodes).forEach(([k,n])=>{if(n.ev)chkEv(n.ev,"Dialog "+k);const ch=n.ch||[];
  ch.forEach((c,i)=>{const w="Dialog "+k+", Option "+i;if(c.ev)chkEv(c.ev,w);if(c.evFail)chkEv(c.evFail,w+" (evFail)");chkReq(c.req,w)});
  if(ch.length&&!n.exhaustive&&ch.every(c=>c.req!==undefined))m.push("Dialog "+k+": keine Option ohne Voraussetzung (Sackgassengefahr)")});
 const setF=new Set(),setI=new Set(),useF=[],useI=[];
 const evs=l=>[].concat(l==null?[]:l).filter(e=>e&&typeof e==="object");

 const scanReq=(q,w)=>{if(q===undefined)return;[].concat(q).forEach(c=>{if(!c||typeof c!=="object")return;if("flag" in c)useF.push([c.flag,w]);if("noflag" in c)useF.push([c.noflag,w]);if("inv" in c)useI.push([c.inv,w]);if("noinv" in c)useI.push([c.noinv,w])})};
 Object.entries(P.scenes).forEach(([k,sc])=>(sc.spots||[]).forEach((o,i)=>{if(o.once)setF.add(o.once);if(o.give)setI.add(o.give);scanEv(o.ev);scanReq(o.req,"Szene "+k+", Hotspot "+i)}));
 Object.entries(P.nodes).forEach(([k,n])=>{[].concat(n.set==null?[]:n.set).forEach(f=>setF.add(f));if(n.give)setI.add(n.give);scanEv(n.ev);(n.ch||[]).forEach((c,i)=>{scanEv(c.ev);scanEv(c.evFail);scanReq(c.req,"Dialog "+k+", Option "+i)})});
 if(P.jump)(P.jump.grants||[]).forEach(g=>{(g.flags||[]).forEach(f=>setF.add(f));(g.inv||[]).forEach(x=>setI.add(x))});
 if(P.jump)(P.jump.routes||[]).forEach(r=>(r.opts||[]).forEach(o=>(o.grants||[]).forEach(g=>{(g.flags||[]).forEach(f=>setF.add(f));(g.inv||[]).forEach(x=>setI.add(x))})));
 (P.diary||[]).forEach(d=>scanReq(d&&d.req,"Tagebuch "+(d&&d.id)));useF.forEach(([f,w])=>{if(!setF.has(f))m.push(w+': Merker "'+f+'" wird nirgends gesetzt')});

const tgOk=x=>!x||x==="end"||(String(x).startsWith("fight:")?!!P.fights[String(x).slice(6)]:!!P.nodes[x]);

/* Held als Spritesheet: Ruhe, Ausholen, Strecken 1, Strecken 2 (vier Bilder nebeneinander).
   Kopf- und Körperschlag spielen alle vier Bilder; beim Körperschlag taucht der Held zusätzlich ab (CFG.sprite.bodyDip in % der Figurhöhe), damit die Faust auf Körperhöhe des Gegners landet. Linker Schlag = gespiegelt. */
const SPR_ON=()=>!!urls[HI("punch")];
function SPR(a,bk){if(!SPR_ON())return bk?`<img src="${bk}" alt="">`:BACK;
 const k=a.sp?` p${a.sp}${a.sps==="L"?" mir":""}`:"";
 return `<div class="spr${k}" style="background-image:url('${urls[HI("punch")]}')"></div>`}

/* Kapitel-Sprung: springt an den Anfang eines Kapitels, mit Gesundheit, Geld, Gegenständen und Merkern, die man bis dahin normalerweise gesammelt hat.
   Die Schalter im Fenster entscheiden über frühere Wegmöglichkeiten. */
const JUMP=P.jump?P.jump.chapters:[];
const JO=P.jump?Object.assign({money:P.jump.money!==undefined?P.jump.money:100},Object.fromEntries(P.jump.opts.map(o=>[o.k,!!o.def]))):{money:100};
/* Routenwahl (P.jump.routes): je Gruppe genau eine Option (Standard: "def"). Option: {id,t,def,needs:{Gruppe:[ids]},grants:[{from,flags,inv,sym,needs}]}.
   "needs" an der Option: passt die Wahl nicht, gilt die Standard-Option der Gruppe (mit Hinweis). "needs" an einer Gewährung: nur dann wirksam. */
const JR=(P.jump&&P.jump.routes)||[];
const JS=Object.fromEntries(JR.map(r=>[r.k,(r.opts.find(o=>o.def)||r.opts[0]).id]));
const needOk=(nd,sel)=>!nd||Object.entries(nd).every(([g,l])=>[].concat(l).includes(sel[g]));
function routeSel(){const sel={...JS},notes=[];
 JR.forEach(r=>{const o=r.opts.find(x=>x.id===JS[r.k]);if(o&&!needOk(o.needs,JS)){const f=r.opts.find(x=>x.def)||r.opts[0];sel[r.k]=f.id;notes.push("\""+o.t+"\" geht mit dieser Route nicht, stattdessen: \""+f.t+"\"")}});
 return{sel,notes}}
/* Sprungziel: Gesundheit voll, Geld aus dem Feld, Gegenstaende und Merker aus P.jump.grants (ab Kapitel "from", optional abhaengig von einem Schalter "when"/"whenNot") */
function jumpState(n){
 const j=JUMP[n-1],s=fresh(),inv=[],fl={};
 s.scene=j.s;s.ch=n;s.hp=CFG.hero.maxHp;s.money=JO.money;
 P.jump.grants.forEach(g=>{if(n<g.from)return;if(g.when&&!JO[g.when])return;if(g.whenNot&&JO[g.whenNot])return;
  (g.inv||[]).forEach(x=>inv.push(x));(g.flags||[]).forEach(k=>fl[k]=1)});
 const rs=routeSel();
 JR.forEach(r=>{const o=r.opts.find(x=>x.id===rs.sel[r.k]);if(!o)return;(o.grants||[]).forEach(g=>{if(n<g.from||!needOk(g.needs,rs.sel))return;
  (g.inv||[]).forEach(x=>inv.push(x));(g.flags||[]).forEach(k=>fl[k]=1);Object.entries(g.sym||{}).forEach(([k,v])=>{if(s.rel&&s.rel[k])s.rel[k].sympathy=v})})});
 s.inv=inv;s.flags=fl;s.msg="Sprung zu: "+U("chapter")+" "+n+": "+j.t+"."+(rs.notes.length?" Hinweis: "+rs.notes.join("; ")+".":"");s.ck=snap(s);return s}
/* Sprungmarken zu einzelnen Szenen (P.jump.marks): {t, s: Szene, node: Dialog, ch: Kapitelstand, sym: {Begleiter: Sympathie 0..100}} */
function doMark(i){const m=((P.jump||{}).marks||[])[i];if(!m)return;clearInterval(tm);fightStop();showJump=false;const s=jumpState(m.ch||1);s.scene=m.s;s.ch=CHS[m.s]||s.ch;Object.entries(m.sym||{}).forEach(([k,v])=>{if(s.rel&&s.rel[k])s.rel[k].sympathy=v});s.msg="Sprung zur Szene: "+m.t+".";s.ck=snap(s);S=s;if(m.node)goNode(m.node);else render()}
function doJump(i){const n=i+1;if(!JUMP[i])return;clearInterval(tm);fightStop();showJump=false;S=jumpState(n);render()}
function jumpPanel(){
 if(!P.jump)return"";
 const cb=(k,t)=>`<label style="display:block;margin:4px 0"><input type="checkbox" data-a="jo" data-k="${k}"${JO[k]?" checked":""}> ${t}</label>`;
 return `<div class="pn"><h2>Zu ${U("chapter")} springen</h2><p>Du startest mit voller Gesundheit (${CFG.hero.maxHp} ${U("hp")}), dem Geld aus dem Feld unten und allen Gegenständen und Informationen, die man bis dahin normalerweise gesammelt hat. Dein aktueller Spielstand wird dabei ersetzt.</p>`+
 `<div class="im"><b>Was bisher geschah</b>${P.jump.opts.map(o=>cb(o.k,o.t)).join("")}</div>${JR.length?`<div class="im"><b>Welche Route bis dahin?</b><p style="margin:4px 0">Gilt ab ${U("chapter")} 2. Für frühere Abschnitte hat sie keine Wirkung.</p>${JR.map(r=>`<div style="margin:6px 0"><u>${E(r.t)}</u>${r.opts.map(o=>`<label style="display:block;margin:2px 0"><input type="radio" name="jr_${r.k}" data-a="jr" data-k="${r.k}" data-v="${o.id}"${JS[r.k]===o.id?" checked":""}> ${E(o.t)}</label>`).join("")}</div>`).join("")}</div>`:""}<div class="im"><label style="display:block;margin:6px 0">Geld: <input type="number" min="0" max="9999" value="${JO.money}" data-a="jmoney" style="width:90px;font:inherit"> ${U("money")}</label></div>`+
 `<div class="chs">`+JUMP.map((j,i)=>`<button class="ch" data-a="jump" data-i="${i}"><em class="tag" style="background:#555">${U("chapter")} ${j.n}</em>${E(j.t)}</button>`).join("")+`</div>`+(((P.jump.marks)||[]).length?`<div class="im"><b>Szenen</b></div><div class="chs">`+P.jump.marks.map((m,i)=>`<button class="ch" data-a="mark" data-i="${i}"><em class="tag" style="background:#d6336c">Szene</em>${E(m.t)}</button>`).join("")+`</div>`:"")+`<div class="row"><button class="btn" data-a="close">Schließen</button></div></div>`}
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.a==="jmoney")JO.money=Math.max(0,Math.min(9999,parseInt(t.value)||0))});

/* Tagebuch: Notizen des Helden. Jeder Eintrag in P.diary hat id, ch (Kapitel), req (Voraussetzung, gleiche Syntax wie bei Hotspots) und t (Text).
   Ein Eintrag erscheint, sobald seine Voraussetzung im Spielstand erfüllt ist. Es wird nichts extra gespeichert, alles ergibt sich aus Merkern und Ereignissen. */
const CATS=["Beweise","Aussagen","Details","Schlussfolgerungen"];
const catHtml=L=>{const g={};L.forEach(d=>(g[d.cat||""]=g[d.cat||""]||[]).push(d));return [...CATS,""].filter(k=>g[k]).map(k=>(k&&L.some(d=>d.cat)?`<p class="dc">${k}</p>`:"")+g[k].map(d=>`<p class="dy">${E(d.t)}</p>`).join("")).join("")};
const diaryList=()=>(P.diary||[]).filter(d=>condOk(d.req));
function diaryPanel(){
 const L=diaryList(),H=P.diaryHeads||{},by={};L.forEach(d=>(by[d.ch]=by[d.ch]||[]).push(d));
 const chs=Object.keys(by).map(Number).sort((a,b)=>a-b);
 return `<div class="pn"><h2>${E(U("diaryTitle")||U("diary"))}</h2>`+(L.length?chs.map(c=>`<div class="im"><b>${U("chapter")} ${c}${H[c]?" · "+E(H[c]):""}</b>${catHtml(by[c])}</div>`).join(""):`<p>Noch nichts notiert. Erst muss ich etwas herausfinden.</p>`)+`<div class="row"><button class="btn" data-a="close">Schließen</button></div></div>`}

/* Ereignisse: Klicks, Datei-Upload, Tastatur */
let dw=null;
document.addEventListener("mouseover",e=>{const b=e.target.closest&&e.target.closest(".spot[data-dw]");if(!b||!S||S.mode!=="scene")return;clearTimeout(dw);const i=+b.dataset.i;dw=setTimeout(()=>{const s=P.scenes[S.scene].spots[i];if(s&&s.t==="look"&&s.ev){const before=diaryList().length;runEv(s.ev);const d=document.querySelector('[data-a="dj"]');if(d)d.textContent=U("diary")+" ("+diaryList().length+")";if(diaryList().length>before&&d){d.style.background="var(--sun)";setTimeout(()=>{d.style.background=""},900)}saveGame()}},P.dwell||600)},true);
document.addEventListener("mouseout",e=>{const b=e.target.closest&&e.target.closest(".spot[data-dw]");if(b)clearTimeout(dw)},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="tf"){testFight(P.testFight);return}
 if(a==="dj"){showDiary=true;render();return}if(a==="jm"){showJump=true;render();return}if(a==="jump"){doJump(i);return}if(a==="mark"){doMark(i);return}if(a==="jo"){JO[b.dataset.k]=b.checked;return}if(a==="jr"){JS[b.dataset.k]=b.dataset.v;return}
 if(a==="spot")spot(i);else if(a==="ch")pick((P.nodes[S.node]||{ch:[]}).ch[i]);else if(a==="act")fAct(b.dataset.k);else if(a==="pk"){const n=S.floor.splice(i,1)[0];if(n){S.inv.push(n);S.msg="Aufgehoben: "+n}render()}else if(a==="cut")cut(i);
 else if(a==="rc")restartChapter();else if(a==="rs"){if(!confirm("Ganz neu beginnen? Der gespeicherte Spielstand wird überschrieben."))return;clearInterval(tm);fightStop();S=fresh();render()}else if(a==="bi"){showImg=true;render()}else if(a==="close"){showImg=false;showJump=false;showDiary=false;render()}
 else if(a==="copy"){const t=Object.entries(P.images).map(([id,m])=>`${id} (${m.ar}): ${m.p}`).join("\n\n");try{navigator.clipboard.writeText(t).then(()=>b.textContent="Kopiert",()=>b.textContent="Kopieren nicht möglich")}catch(x){b.textContent="Kopieren nicht möglich"}}});
document.addEventListener("change",async e=>{const t=e.target;if(t.type==="file"&&t.files[0]){let f=t.files[0];const id=t.dataset.id;try{if(/^(body|back|fist|item)_/.test(id)){f=await cutout(f);cutI[id]=cutout.last}else{f=await norm(f);cutI[id]=null}}catch(x){cutI[id]=-3;cutT[id]=f.type||"unbekannt";render();return}try{saveImg(id,f);render()}catch(x){sv[id]=-1;rpan()}}});
document.addEventListener("keydown",e=>{if(!S||S.mode!=="fight"||e.ctrlKey||e.metaKey||e.altKey)return;
 const el=e.target;if(el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)))return; /* Tippen in Eingabefeldern löst keine Kampfaktion aus */
 if(showJump||showImg||showDiary)return; /* offenes Fenster: keine Kampftasten */const K=CFG.keys,k=e.key.length>1?e.key:e.key.toLowerCase(),
 m={[K.headL]:"pl",[K.headR]:"pr",[K.bodyL]:"bl",[K.bodyR]:"br",[K.throw]:"te",[K.dodgeL]:"dl",[K.dodgeR]:"dr",[K.duck]:"du",[K.ko]:"ko"}[k];
 if(m){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();fAct(m)}});

/* Start: leitet Bild-Slots aus dem Plot ab und startet das Spiel */
Object.values(P.fights).forEach(f=>{P.images["fist_"+f.who]={ar:"1:1",p:(P.style||"")+"Eine geballte Faust von "+P.chars[f.who].n+", frontal auf die Kamera zufliegend, Knöchel groß im Vordergrund, Ärmel passend zur Figur, reiner weißer Hintergrund ohne Schatten."}});
Object.values(P.items).forEach(it=>{P.images["item_"+it.id]={ar:"1:1",p:(P.style||"")+"Einzelner Gegenstand: "+it.pr+", Seitenansicht, reiner weißer Hintergrund ohne Schatten."}});
/* Spritesheet des Helden: Werte aus CFG.sprite, ueberschrieben durch P.sprite (Plot-Daten):
   {fw,fh: Groesse eines Bildes, frames: Bilder nebeneinander (Standard 4), headMs/bodyMs: Dauer, bodyDip: Abtauchen in %, hit: Bild, in dem die Faust trifft,
    seq: eigene Reihenfolge [[Bildnummer, Zeitanteil 0..1],...]; ohne seq laufen alle Bilder in gleichen Schritten}
   Der Schaden greift im Bild "hit" (CFG.player.dmgDelay wird daraus abgeleitet). Ohne P.sprite bleibt alles wie vorher. */
const SP=Object.assign({frames:4},CFG.sprite,P.sprite||{});
const seqTime=(sp,i)=>{const q=Array.isArray(sp.seq)&&sp.seq.length?sp.seq.find(e=>e[0]===i):null;return q?q[1]:(sp.frames>1?i/(sp.frames-1):0)};
function spriteCss(sp){const n=sp.frames,pos=i=>n>1?+(i/(n-1)*100).toFixed(4):0;
 const seq=Array.isArray(sp.seq)&&sp.seq.length?sp.seq:Array.from({length:n},(_,i)=>[i,n>1?i/(n-1):0]);
 const stops=seq.map(([i,t],k)=>(+(t*100).toFixed(4))+"%{background-position:"+pos(i)+"% 0"+(k<seq.length-1?";animation-timing-function:steps(1,end)":"")+"}").join("");
 return ".spr{background-size:"+n*100+"% 100%}@keyframes sprH{"+stops+"}"}
{const r=document.documentElement.style;{const X=CFG.fx||{},K=X.koFly||{};if(X.punchShift!=null)r.setProperty("--ps",X.punchShift+"px");if(X.markScale!=null)r.setProperty("--mark-scale",X.markScale);Object.keys(K).forEach(k=>r.setProperty("--ko-"+k,K[k]))}r.setProperty("--sprH",SP.headMs+"ms");r.setProperty("--sprB",SP.bodyMs+"ms");r.setProperty("--efs",CFG.enemyFist.scale);r.setProperty("--sprDip",(SP.bodyDip!=null?SP.bodyDip:18)+"%");r.setProperty("--spr-ar",SP.fw+"/"+SP.fh);r.setProperty("--spr-bs",SP.frames*100+"%");
 if(P.sprite){if(typeof SP.hit==="number"&&SP.frames>1)CFG.player.dmgDelay=Math.round(SP.headMs*seqTime(SP,SP.hit));
  if(document.head&&document.createElement){const st=document.createElement("style");st.id="plot-sprite";st.textContent=spriteCss(SP);document.head.appendChild(st)}}}
(async()=>{await loadImgs();for(const k in DEF){urls[k]=d2u(DEF[k]);BI[k]=1}try{checkPlot()}catch(e){console.error(e)}S=loadGame()||fresh();if(loadNote&&!S.msg)S.msg=loadNote;render();{const m=String(location.search).match(/[?&]kampf=(\w+)/);if(m)testFight(m[1])}})();

</script></body></html>
